<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <h1 class="text-white font-black tracking-tight leading-none" style="font-size: 120px; font-weight: 900;">f_beat</h1>
    <p class="text-[60px] font-bold tracking-tight mt-4" style="color: #00FF94;">| f₁ - f₂ |</p>
    <p class="text-[18px] text-[#666666] mt-10 leading-relaxed">When two sound waves of nearly identical frequency interfere, they produce a pulsing amplitude envelope. The beat frequency equals the absolute difference between the two source frequencies.</p>
