<body class="bg-[#0a1628] flex flex-col items-center justify-center min-h-[900px] px-16 py-20">
  <div class="text-left w-full">
    <p class="text-[18px] text-[#00B4D8] font-semibold tracking-widest uppercase mb-4">Card 1 of 3</p>
    <h2 class="text-[72px] font-black text-white leading-none mb-8">The Cold Position</h2>
    <p class="text-[28px] text-[#a0c4d8] leading-relaxed mb-12">A cold position is any pile size where the player about to move cannot force a win, assuming optimal play. In Bachet's Game, cold positions form a perfectly predictable pattern: every (M+1) stones.</p>
    <div class="flex items-center gap-4 mt-auto">
      <div class="w-16 h-1 bg-[#00FF94] rounded-full"></div>
      <p class="text-[16px] text-[#4a6a7a] font-medium">Bachet's Game · Elysia Tools</p>
    </div>
  </div>
