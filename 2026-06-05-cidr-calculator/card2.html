<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  background: #000;
}
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[24px] font-bold text-[#00B4D8] tracking-[0.3em] uppercase mb-4">The cheat sheet</p>
    <p class="text-[68px] font-black text-white leading-[0.95] mb-12">Slash to address count</p>
    <div class="space-y-4">
      <div class="grid grid-cols-3 gap-4 pb-3 border-b-2 border-[#00B4D8]">
        <span class="mono text-[20px] text-[#00B4D8] font-bold tracking-wider">PREFIX</span>
        <span class="mono text-[20px] text-[#00B4D8] font-bold tracking-wider">USABLE HOSTS</span>
        <span class="text-[20px] text-[#00B4D8] font-bold tracking-wider">USE CASE</span>
      </div>
      <div class="grid grid-cols-3 gap-4 items-baseline py-2">
        <span class="mono text-[28px] text-white font-semibold">/30</span>
        <span class="mono text-[28px] text-[#00FF94] font-semibold">2</span>
        <span class="text-[20px] text-[#888]">Point-to-point link</span>
      </div>
      <div class="grid grid-cols-3 gap-4 items-baseline py-2">
        <span class="mono text-[28px] text-white font-semibold">/27</span>
        <span class="mono text-[28px] text-[#00FF94] font-semibold">30</span>
        <span class="text-[20px] text-[#888]">Small office / DB tier</span>
      </div>
      <div class="grid grid-cols-3 gap-4 items-baseline py-2">
        <span class="mono text-[28px] text-white font-semibold">/24</span>
        <span class="mono text-[28px] text-[#00FF94] font-semibold">254</span>
        <span class="text-[20px] text-[#888]">Web tier, single VLAN</span>
      </div>
      <div class="grid grid-cols-3 gap-4 items-baseline py-2">
        <span class="mono text-[28px] text-white font-semibold">/22</span>
        <span class="mono text-[28px] text-[#00FF94] font-semibold">1,022</span>
        <span class="text-[20px] text-[#888]">Departmental network</span>
      </div>
      <div class="grid grid-cols-3 gap-4 items-baseline py-2">
        <span class="mono text-[28px] text-white font-semibold">/16</span>
        <span class="mono text-[28px] text-[#00FF94] font-semibold">65,534</span>
        <span class="text-[20px] text-[#888]">Campus, large VPC</span>
      </div>
      <div class="grid grid-cols-3 gap-4 items-baseline pt-2 border-t border-[#222]">
        <span class="mono text-[28px] text-white font-semibold">/8</span>
        <span class="mono text-[28px] text-[#00FF94] font-semibold">16,777,214</span>
        <span class="text-[20px] text-[#888]">Class A, ISP-scale</span>
      </div>
    </div>
  </div>
</body>
</html>
