<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  background: #000;
}
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[24px] font-bold text-[#00B4D8] tracking-[0.3em] uppercase mb-4">Why IPv6 breaks the rules</p>
    <p class="text-[68px] font-black text-white leading-[0.95] mb-12">4.3 billion vs 340 undecillion</p>
    <div class="grid grid-cols-2 gap-8 mb-10">
      <div class="border-l-4 border-[#FF6B35] pl-6 py-2">
        <p class="mono text-[24px] text-[#FF6B35] font-bold mb-2">IPv4 /32</p>
        <p class="mono text-[72px] text-white font-black leading-none">1</p>
        <p class="text-[20px] text-[#888] mt-2">address</p>
      </div>
      <div class="border-l-4 border-[#00FF94] pl-6 py-2">
        <p class="mono text-[24px] text-[#00FF94] font-bold mb-2">IPv6 /64</p>
        <p class="mono text-[64px] text-white font-black leading-none">1.8 × 10¹⁹</p>
        <p class="text-[20px] text-[#888] mt-2">addresses per subnet</p>
      </div>
    </div>
    <div class="space-y-3 pt-6 border-t border-[#222]">
      <p class="text-[22px] text-[#ccc]"><span class="text-[#00B4D8] font-bold">No broadcast</span> — IPv6 uses multicast instead</p>
      <p class="text-[22px] text-[#ccc]"><span class="text-[#00B4D8] font-bold">No subtraction</span> — every address is usable</p>
      <p class="text-[22px] text-[#ccc]"><span class="text-[#00B4D8] font-bold">BigInt math</span> — counts exceed 2⁵³, so JS uses BigInt</p>
    </div>
  </div>
</body>
</html>
