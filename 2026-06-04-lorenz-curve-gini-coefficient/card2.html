<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[90px] py-20">
    <p class="text-[20px] text-[#00B4D8] tracking-[0.3em] font-semibold uppercase mb-6">Card 02 / The Number</p>
    <h2 class="text-[110px] font-black text-[#00B4D8] leading-none tracking-tight mb-10">0.41</h2>
    <p class="text-[36px] text-white leading-tight font-bold mb-10 max-w-[800px] mx-auto">The U.S. Gini coefficient. The gap between the curve and the diagonal, divided by the triangle.</p>
    <div class="grid grid-cols-3 gap-6 text-left max-w-[900px] mx-auto">
      <div class="border-l-4 border-[#00B4D8] pl-5">
        <p class="text-[64px] font-black text-white">0.27</p>
        <p class="text-[18px] text-[#888] mt-1">Denmark, Norway, Sweden</p>
      </div>
      <div class="border-l-4 border-[#00B4D8] pl-5">
        <p class="text-[64px] font-black text-white">0.41</p>
        <p class="text-[18px] text-[#888] mt-1">United States</p>
      </div>
      <div class="border-l-4 border-[#00B4D8] pl-5">
        <p class="text-[64px] font-black text-white">0.63</p>
        <p class="text-[18px] text-[#888] mt-1">South Africa</p>
      </div>
    </div>
  </div>
</body>
</html>
