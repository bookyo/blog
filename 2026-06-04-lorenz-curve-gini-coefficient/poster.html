<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
}
.lorenz {
  fill: none;
  stroke: #00B4D8;
  stroke-width: 6;
  stroke-linecap: round;
}
.diagonal {
  fill: none;
  stroke: #666;
  stroke-width: 3;
  stroke-dasharray: 8 8;
  opacity: 0.6;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <p class="text-[22px] text-[#666] tracking-[0.4em] font-light uppercase mb-8">Inequality, Mapped</p>
    <h1 class="text-[120px] font-black text-white tracking-tight leading-[1.0] mb-2">THE LORENZ</h1>
    <h1 class="text-[120px] font-black text-white tracking-tight leading-[1.0] mb-10">CURVE</h1>
    <svg viewBox="0 0 400 220" class="mx-auto mb-10" width="520" height="286">
      <line x1="20" y1="200" x2="380" y2="200" stroke="#444" stroke-width="2"/>
      <line x1="20" y1="20" x2="20" y2="200" stroke="#444" stroke-width="2"/>
      <line x1="20" y1="20" x2="380" y2="200" stroke="#666" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
      <path d="M 20 200 Q 80 195 140 175 Q 200 145 250 105 Q 310 60 380 20" class="lorenz"/>
      <text x="200" y="218" fill="#666" font-size="14" text-anchor="middle" font-family="Outfit">Population (poorest → richest)</text>
      <text x="14" y="110" fill="#666" font-size="14" text-anchor="middle" font-family="Outfit" transform="rotate(-90 14 110)">Cumulative income share</text>
    </svg>
    <p class="text-[42px] font-bold text-[#00B4D8] tracking-tight">One line. Every economy.</p>
    <p class="text-[18px] text-[#888] mt-6 leading-relaxed max-w-[800px] mx-auto">A bowed curve, a single number between 0 and 1, and the geometry that quietly runs every inequality debate in the world.</p>
  </div>
</body>
</html>
