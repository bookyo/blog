<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; }
.diagonal { stroke: #666; stroke-width: 3; stroke-dasharray: 8 8; opacity: 0.5; }
.lorenz { fill: none; stroke: #00B4D8; stroke-width: 7; stroke-linecap: round; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[90px] py-20">
    <p class="text-[20px] text-[#00B4D8] tracking-[0.3em] font-semibold uppercase mb-6">Card 01 / The Picture</p>
    <h2 class="text-[100px] font-black text-white leading-[1.0] tracking-tight mb-12">Plot the Population</h2>
    <svg viewBox="0 0 400 220" class="mx-auto mb-12" width="600" height="330">
      <line x1="20" y1="200" x2="380" y2="200" stroke="#444" stroke-width="2"/>
      <line x1="20" y1="20" x2="20" y2="200" stroke="#444" stroke-width="2"/>
      <line x1="20" y1="20" x2="380" y2="200" class="diagonal"/>
      <path d="M 20 200 Q 80 195 140 175 Q 200 145 250 105 Q 310 60 380 20" class="lorenz"/>
    </svg>
    <p class="text-[36px] font-bold text-white leading-tight max-w-[800px] mx-auto">Sort 100 people from poorest to richest. The curve below the diagonal is inequality, drawn out.</p>
  </div>
</body>
</html>
