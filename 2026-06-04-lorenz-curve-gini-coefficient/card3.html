<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; }
.diagonal { stroke: #666; stroke-width: 3; stroke-dasharray: 8 8; opacity: 0.5; }
.equal { fill: none; stroke: #00B4D8; stroke-width: 7; }
.unequal { fill: none; stroke: #FF6B35; stroke-width: 7; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[90px] py-20">
    <p class="text-[20px] text-[#00B4D8] tracking-[0.3em] font-semibold uppercase mb-6">Card 03 / The Lever</p>
    <h2 class="text-[80px] font-black text-white leading-[1.05] tracking-tight mb-10 max-w-[900px] mx-auto">Policy Moves the Curve</h2>
    <div class="grid grid-cols-2 gap-8 mb-10 max-w-[900px] mx-auto">
      <div>
        <svg viewBox="0 0 200 200" class="mx-auto" width="280" height="280">
          <line x1="20" y1="180" x2="180" y2="180" stroke="#444" stroke-width="2"/>
          <line x1="20" y1="20" x2="20" y2="180" stroke="#444" stroke-width="2"/>
          <line x1="20" y1="20" x2="180" y2="180" class="diagonal"/>
          <path d="M 20 180 Q 60 178 100 165 Q 140 145 180 100" class="equal"/>
          <text x="100" y="195" fill="#888" font-size="11" text-anchor="middle">Population</text>
        </svg>
        <p class="text-[22px] font-bold text-[#00B4D8] mt-3">High taxes, strong safety net</p>
        <p class="text-[18px] text-white mt-1">Gini 0.27</p>
      </div>
      <div>
        <svg viewBox="0 0 200 200" class="mx-auto" width="280" height="280">
          <line x1="20" y1="180" x2="180" y2="180" stroke="#444" stroke-width="2"/>
          <line x1="20" y1="20" x2="20" y2="180" stroke="#444" stroke-width="2"/>
          <line x1="20" y1="20" x2="180" y2="180" class="diagonal"/>
          <path d="M 20 180 Q 50 179 80 170 Q 120 145 160 60 Q 175 30 180 20" class="unequal"/>
          <text x="100" y="195" fill="#888" font-size="11" text-anchor="middle">Population</text>
        </svg>
        <p class="text-[22px] font-bold text-[#FF6B35] mt-3">Low redistribution, top-heavy</p>
        <p class="text-[18px] text-white mt-1">Gini 0.63</p>
      </div>
    </div>
    <p class="text-[24px] text-white leading-tight max-w-[800px] mx-auto">The shape is the policy. The number is its signature.</p>
  </div>
</body>
</html>
