<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <!-- Core focal point: the 1/λ⁴ formula as the centerpiece -->
    <p class="text-[18px] text-[#666666] tracking-[4px] uppercase mb-8">Rayleigh Scattering</p>
    <!-- Main focal: 1/λ⁴ -->
    <h1 class="text-[160px] font-black text-white tracking-tight leading-none">1/λ⁴</h1>
    <!-- Secondary -->
    <p class="text-[48px] font-bold text-[#00B4D8] mt-6 tracking-tight">Why the Sky Is Blue</p>
    <!-- Tertiary: sunset red -->
    <p class="text-[32px] font-bold text-[#FF6B35] mt-4 tracking-tight">Why Sunsets Are Red</p>
    <!-- Bottom description -->
    <p class="text-[18px] text-[#666666] mt-12 leading-relaxed">The fourth-power law that paints our sky</p>
  </div>
</body>
</html>
