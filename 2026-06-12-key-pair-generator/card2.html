<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <span class="block text-[100px] font-black text-white tracking-tight leading-[0.95]">Three Algorithms,</span><br/><span class="block text-[100px] font-black text-white tracking-tight leading-[0.95]">Three Math Problems</span>
    <p class="text-[36px] font-bold text-[#00FF94] mt-6 tracking-tight">RSA · ECC · Ed25519</p>
    <p class="text-[22px] text-[#dddddd] mt-10 leading-relaxed whitespace-pre-line font-light">RSA — multiply large primes. 2048 bits standard.

Ed25519 — fast, tiny signatures. SSH default.</p>
