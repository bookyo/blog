<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <span class="block text-[100px] font-black text-white tracking-tight leading-[0.95]">PEM · Hex · Base64</span>
    <p class="text-[36px] font-bold text-[#FF6B35] mt-6 tracking-tight">Same Key, Three Outfits</p>
    <p class="text-[22px] text-[#dddddd] mt-10 leading-relaxed whitespace-pre-line font-light">PEM — base64 wrapped in BEGIN/END headers.
Hex — base64 converted to hexadecimal digits.
Base64 — minimal text, no headers.
The bytes after decoding are bit-for-bit identical.</p>
  </div>
</body>
</html>
