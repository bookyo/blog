<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1280px; min-height: 720px; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-[#0A0A0A] flex items-center justify-center">
  <div class="w-[1280px] px-[80px] py-[60px]">
    <p class="mono text-[20px] text-[#00B4D8] tracking-[0.3em] mb-4">RULE 9 — BUILD METADATA</p>
    <h2 class="text-[64px] font-black text-white leading-[1.05] mb-8">+build is invisible to sort</h2>
    <div class="bg-[#1A1A1A] border-l-4 border-[#00B4D8] p-6 mb-6">
      <p class="mono text-[22px] text-[#00FF94]">1.0.0+a  ==  1.0.0+b  (same version)</p>
    </div>
    <p class="text-[28px] text-[#AAAAAA] leading-snug">The suffix is for reproducibility, not for ordering.<br/>A validator that ranks them is misreading the spec.</p>
  </div>
</body>
</html>
