<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a1628] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[14px] font-bold text-[#00B4D8] tracking-[0.3em] uppercase mb-6">Complex Plane Geometry</p>
    <h2 class="text-[64px] font-black text-white leading-tight">The Circle That Never Closes</h2>
    <p class="text-[22px] text-[#94B8D0] mt-6 leading-relaxed">Every horizontal line in the z-plane maps to a ray at angle y. Every vertical line maps to a circle at radius e^x. The plane reorganizes — it doesn't distort.</p>
  </div>
</body>
</html>
