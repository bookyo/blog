<body class="bg-[#0d1f17] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[14px] font-bold text-[#00FF94] tracking-[0.3em] uppercase mb-6">Fractal Structure</p>
    <h2 class="text-[64px] font-black text-white leading-tight">The Julia Set at c = 0</h2>
    <p class="text-[22px] text-[#7FB89A] mt-6 leading-relaxed">Iterating z → e^z from z = 0 produces spiral arms wrapped in spiral arms. The boundary is not a curve — it has fractal dimension ≈ 1.95. Every zoom reveals more.</p>
