<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#1a0f05] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[14px] font-bold text-[#FF6B35] tracking-[0.3em] uppercase mb-6">Euler's Identity</p>
    <h2 class="text-[64px] font-black text-white leading-tight">e^(iπ) = -1 in Full Color</h2>
    <p class="text-[22px] text-[#C9A48B] mt-6 leading-relaxed">Travel π units up the imaginary axis. The radius stays 1. The angle sweeps π. You arrive at -1 — the point maximally distant in angle but exactly unit distance from origin.</p>
  </div>
</body>
