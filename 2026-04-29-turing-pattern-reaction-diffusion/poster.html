<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turing Pattern Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; }
</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <!-- Focal point: THE MATH OF SPOTS -->
    <h1 class="text-[120px] font-black text-white tracking-tight leading-none">THE MATH OF</h1>
    <h1 class="text-[160px] font-black text-[#00FF94] tracking-tight leading-none mt-[-10px]">SPOTS</h1>

    <p class="text-[48px] font-bold text-white mt-8 tracking-tight">Turing Pattern</p>
    
    <!-- Description -->
    <p class="text-[20px] text-[#888888] mt-8 leading-relaxed">Reaction-Diffusion Model — How Alan Turing Explained<br>Why Leopards Have Spots and Your Fingers Have Shape</p>
