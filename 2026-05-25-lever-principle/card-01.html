<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#0a0f1a] flex items-center justify-center min-h-screen">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-[#00B4D8] text-[16px] font-semibold tracking-widest uppercase mb-4">The Core Idea</p>
    <h2 class="text-[72px] font-extrabold text-white leading-none mb-8">Torque Is What Matters</h2>
    <p class="text-[28px] text-[#94a3b8] font-light leading-relaxed">τ = F × r — Force times perpendicular distance from the pivot. When both sides balance, the lever doesn't rotate.</p>
    <div class="mt-10 flex items-center gap-4">
      <div class="bg-[#00FF94] text-black font-bold text-[20px] px-5 py-2 rounded-full">τ₁ = τ₂</div>
      <span class="text-[#666666] text-[22px]">Equilibrium Condition</span>
    </div>
  </div>
</body>
</html>
