<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#1a0a0f] flex items-center justify-center min-h-screen">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-[#FF6B35] text-[16px] font-semibold tracking-widest uppercase mb-4">The Multiplier</p>
    <h2 class="text-[72px] font-extrabold text-white leading-none mb-8">Mechanical Advantage</h2>
    <div class="mt-6">
      <div class="text-[100px] font-black text-white">MA = L<sub style="font-size:60px">effort</sub> / L<sub style="font-size:60px">load</sub></div>
    </div>
    <p class="text-[#94a3b8] text-[24px] font-light mt-8 leading-relaxed">A lever with a 4m effort arm and 1m load arm gives MA = 4 — you lift 400N with 100N of effort. Energy is always conserved.</p>
  </div>
</body>
</html>
