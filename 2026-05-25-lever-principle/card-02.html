<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#0f1a0a] flex items-center justify-center min-h-screen">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-[#00FF94] text-[16px] font-semibold tracking-widest uppercase mb-4">Three Classes</p>
    <h2 class="text-[72px] font-extrabold text-white leading-none mb-8">Every Lever Falls Into One of Three</h2>
    <div class="flex gap-8 mt-8">
      <div class="bg-[#1a2a1a] border border-[#00FF94] rounded-2xl px-8 py-6 flex-1">
        <p class="text-[#00FF94] font-bold text-[28px] mb-3">Class 1</p>
        <p class="text-white text-[22px] font-light">Fulcrum in the middle — seesaw, crowbar, scissors</p>
      </div>
      <div class="bg-[#1a2a1a] border border-[#00B4D8] rounded-2xl px-8 py-6 flex-1">
        <p class="text-[#00B4D8] font-bold text-[28px] mb-3">Class 2</p>
        <p class="text-white text-[22px] font-light">Load in the middle — wheelbarrow, nutcracker</p>
      </div>
      <div class="bg-[#1a2a1a] border border-[#FF6B35] rounded-2xl px-8 py-6 flex-1">
        <p class="text-[#FF6B35] font-bold text-[28px] mb-3">Class 3</p>
        <p class="text-white text-[22px] font-light">Effort in the middle — tweezers, forearm</p>
      </div>
    </div>
  </div>
</body>
</html>
