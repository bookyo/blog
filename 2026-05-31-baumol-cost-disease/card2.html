    <h1 class="text-[72px] font-black text-white leading-tight">The Unit Cost Arithmetic</h1>
    <p class="text-[22px] text-[#888888] mt-6 leading-relaxed">Unit labor cost = wage rate ÷ productivity index. When productivity stops growing, unit cost rises at the full rate of wage growth. It's arithmetic, not mismanagement.</p>
    <p class="text-[16px] text-[#444444] mt-8 font-mono">cost = w(t) / A(t) &nbsp;|&nbsp; grows at (g<sub>w</sub> - g<sub>A</sub>)</p>
