<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  padding: 0;
}
.glow {
  text-shadow: 0 0 40px rgba(0, 180, 216, 0.4);
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <p class="text-[24px] font-light text-[#888] tracking-[0.3em] uppercase mb-12">Statistics</p>
    <h1 class="text-[120px] font-black text-white tracking-tight leading-none mb-2 glow">CONFIDENCE</h1>
    <h1 class="text-[120px] font-black text-[#00B4D8] tracking-tight leading-none mb-10 glow">INTERVALS</h1>
    <p class="text-[36px] font-bold text-white mt-10 tracking-tight">Why "X% of voters" headlines</p>
    <p class="text-[36px] font-bold text-[#00B4D8] tracking-tight">hide a math trick</p>
    <p class="text-[20px] text-[#666] mt-16 leading-relaxed">Mean and proportion intervals in your browser</p>
    <p class="text-[18px] text-[#444] mt-4">elysiatools.com/en/tools/confidence-interval-calculator</p>
  </div>
</body>
</html>
