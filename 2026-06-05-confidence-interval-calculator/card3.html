<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  padding: 0;
}
.glow { text-shadow: 0 0 30px rgba(0, 180, 216, 0.5); }
.big {
  font-size: 280px;
  line-height: 1;
  font-weight: 900;
  background: linear-gradient(180deg, #00B4D8 0%, #00FF94 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[24px] font-light text-[#00B4D8] tracking-[0.3em] uppercase mb-2 glow">The pollster's number</p>
    <p class="text-[22px] text-[#888] mb-8">Sample size for ±3% margin at 50/50, 95%</p>

    <p class="big mb-2">1,067</p>
    <p class="text-[28px] text-white font-bold mb-12">respondents</p>

    <div class="text-left bg-[#0a0a0a] border border-[#222] rounded-2xl p-8">
      <p class="text-[24px] text-white mb-4">Halve the precision → quarter the sample</p>
      <p class="text-[24px] text-white mb-4">Double the precision → quadruple the sample</p>
      <p class="text-[24px] text-[#00B4D8] font-bold">width ∝ σ / √n</p>
    </div>
  </div>
</body>
</html>
