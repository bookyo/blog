<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; background: #0D0D0D; }</style>
</head>
<body class="bg-[#0D0D0D] flex items-center justify-center min-h-screen">
<div class="w-[1080px] px-16 py-14">
  <p class="text-[18px] font-semibold tracking-[0.2em] text-[#FF6B35] mb-4">Mathematics</p>
  <h2 class="text-[72px] font-black text-white leading-[1.0] mb-6">n Is the Whole Story</h2>
  <p class="text-[26px] text-white/70 leading-relaxed mb-8">From diamond to squircle in one parameter.</p>
  <ul class="space-y-3 mb-10">
    <li>n = 1 → diamond (rhombus)</li>
<li>n = 2 → standard ellipse/circle</li>
<li>n = 4 → squircle (iOS icons)</li>
<li>n >= 10 → approaches rectangle</li>
  </ul>
  <blockquote class="border-l-4 border-[#FF6B35] pl-6">
    <p class="text-[22px] text-white/80 italic leading-relaxed">"One equation. Three parameters. A spectrum of shapes from circle to rectangle."</p>
  </blockquote>
</div>
</body>
</html>
