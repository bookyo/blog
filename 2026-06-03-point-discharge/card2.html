<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[108px] py-20">
    <p class="text-[20px] font-bold text-[#00B4D8] tracking-widest uppercase mb-6">The Threshold</p>
    <h2 class="text-[64px] font-black text-white leading-none tracking-tight">E ≈ 30 kV/cm</h2>
    <p class="text-[22px] text-[#888888] mt-8 leading-relaxed">The dielectric strength of air. When the local field exceeds this value at a conductor surface, air molecules ionize. The cascade begins. A conductive channel forms in what was previously an insulator.</p>
    <p class="text-[18px] text-[#555555] mt-10">The air breaks down. Corona forms. Charge bleeds away.</p>
  </div>
</body>
</html>
