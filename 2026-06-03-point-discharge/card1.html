<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[108px] py-20">
    <p class="text-[20px] font-bold text-[#00FF94] tracking-widest uppercase mb-6">The Rule</p>
    <h2 class="text-[72px] font-black text-white leading-none tracking-tight">σ = Q / A</h2>
    <p class="text-[22px] text-[#888888] mt-8 leading-relaxed">Surface charge density — charge per unit area. At a sharp tip, the same charge Q crowds into a microscopic area A, making σ spike. Higher σ means stronger local field E = σ/ε₀.</p>
    <p class="text-[18px] text-[#555555] mt-10">Geometry concentrates charge. Physics does the rest.</p>
  </div>
</body>
</html>
