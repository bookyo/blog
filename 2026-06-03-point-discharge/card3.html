<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[108px] py-20">
    <p class="text-[20px] font-bold text-[#FF6B35] tracking-widest uppercase mb-6">The Scaling</p>
    <h2 class="text-[80px] font-black text-white leading-none tracking-tight">E ≈ V / r</h2>
    <p class="text-[22px] text-[#888888] mt-8 leading-relaxed">Field at a spherical conductor surface. Halve the radius r, double the field E — at the same voltage V. A needle tip (r ≈ 0.1 mm) produces fields 100× stronger than a smooth sphere (r ≈ 10 mm).</p>
    <p class="text-[18px] text-[#555555] mt-10">This is why lightning rods end in sharp points — not spheres.</p>
  </div>
</body>
</html>
