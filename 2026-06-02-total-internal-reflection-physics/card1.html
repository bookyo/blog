<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a1628] flex items-center justify-center">
  <div class="w-[1080px] px-16 py-20">
    <div class="flex items-center gap-4 mb-8">
      <div class="w-2 h-12 bg-[#00B4D8] rounded-full"></div>
      <p class="text-[#00B4D8] text-[18px] font-semibold tracking-widest uppercase">Section 1</p>
    </div>
    <h2 class="text-[72px] font-black text-white leading-none mb-6">Snell's Law & The Critical Angle</h2>
    <p class="text-[28px] text-[#94a3b8] font-light leading-relaxed">The critical angle θc = arcsin(n₂/n₁). For glass (n₁=1.50) to air (n₂=1.00), θc ≈ 41.8°. Above this angle — total internal reflection.</p>
    <div class="mt-10 bg-[#0f2744] rounded-2xl p-6 border border-[#1e3a5f]">
      <p class="text-[20px] text-[#00B4D8] font-mono mb-2">n₁ · sin(θ₁) = n₂ · sin(θ₂)</p>
      <p class="text-[16px] text-[#64748b]">When θ₂ = 90°, solve for θc = arcsin(n₂/n₁)</p>
    </div>
  </div>
</body>
</html>
