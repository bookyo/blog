<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[18px] text-[#FF6B35] tracking-[0.3em] font-semibold mb-6">CARD 02 — THE DOT-FILE GUARD</p>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-none">The Line Most</h2>
    <h2 class="text-[80px] font-black text-[#FF6B35] tracking-tight leading-none mt-4">Converters Forget</h2>
    <div class="mt-16 inline-block bg-[#0a0a0a] border border-[#333] rounded-lg p-10 text-left">
      <p class="text-[32px] text-white font-mono"><code class="text-[#00B4D8]">*.txt</code></p>
      <p class="text-[20px] text-[#666666] my-2">↓</p>
      <p class="text-[32px] text-white font-mono"><code class="text-[#00FF94]">^(?!\.)[^/]*\.txt$</code></p>
    </div>
    <p class="text-[22px] text-[#999999] mt-12 leading-relaxed px-12">Drop the <code class="text-[#00B4D8]">(?!\.)</code> and your regex matches <code class="text-white">.env</code>, <code class="text-white">.gitignore</code>, and every other hidden file the bash glob would have skipped.</p>
  </div>
</body>
</html>
