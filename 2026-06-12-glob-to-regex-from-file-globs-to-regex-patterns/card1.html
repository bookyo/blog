<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[18px] text-[#00B4D8] tracking-[0.3em] font-semibold mb-6">CARD 01 — THE TRANSLATION</p>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-none">Three Characters</h2>
    <p class="text-[80px] font-black text-[#00B4D8] tracking-tight leading-none mt-4">Do the Work</p>
    <div class="mt-16 text-left inline-block">
      <p class="text-[36px] text-white font-mono"><code class="text-[#00B4D8]">*</code> &nbsp;→&nbsp; <code class="text-white">[^/]*</code> &nbsp;&nbsp; (no slash)</p>
      <p class="text-[36px] text-white font-mono mt-4"><code class="text-[#00B4D8]">**</code> → <code class="text-white">.*</code> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; (any path)</p>
      <p class="text-[36px] text-white font-mono mt-4"><code class="text-[#00B4D8]">?</code> &nbsp;→&nbsp; <code class="text-white">[^/]</code> &nbsp;&nbsp;&nbsp; (one char)</p>
    </div>
    <p class="text-[20px] text-[#999999] mt-12 leading-relaxed">A glob is a shorthand for matching file paths, not arbitrary text.</p>
  </div>
</body>
</html>
