<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eclipse Article Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <h1 class="text-[130px] font-black text-white tracking-tight leading-none">400×</h1>
    <p class="text-[56px] font-bold text-[#00FF94] mt-6 tracking-tight">400 TIMES SMALLER</p>
    <p class="text-[56px] font-bold text-[#00FF94] mt-2 tracking-tight">400 TIMES FARTHER</p>
    <p class="text-[20px] text-[#888888] mt-12 leading-relaxed">The geometric accident that makes total solar eclipses possible</p>
  </div>
</body>
</html>
