		<p class="text-[20px] tracking-[0.4em] text-[#00FF94] font-semibold mb-6">CARD01 &middot; THE INPUT</p>
		<h2 class="text-[110px] font-black text-white leading-[1.05] tracking-tight">One row per code is the whole job.</h2>
		<p class="text-[26px] text-[#cccccc] mt-10 leading-relaxed">A CSV with two columns &mdash; <span class="text-[#00FF94] font-mono">sku</span>, <span class="text-[#00FF94] font-mono">barcode_value</span> &mdash; one row per product. Each row carries the human label your warehouse reads off the screen and the machine-readable string the barcode encodes. No schema, no template, no mapping UI.</p>
