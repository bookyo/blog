<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a0f1a] flex items-center justify-center">
  <div class="w-[1080px] px-[100px] py-20">
    <p class="text-[16px] text-[#00FF94] tracking-widest uppercase mb-6">Card 01</p>
    <h2 class="text-[72px] font-black text-white leading-tight">Why Droplets Push Back</h2>
    <p class="text-[26px] text-[#aaaaaa] mt-8 leading-relaxed">A spherical water droplet with radius 1 mm generates a pressure difference of only ~145 Pa — but that same ΔP = 2γ/R formula governs soap bubble collapse, inkjet droplet formation, and alveolar inflation in your lungs.</p>
    <div class="mt-10 bg-[#111827] rounded-2xl p-8 border border-[#1e293b]">
      <p class="text-[48px] font-bold text-[#00FF94] text-center">ΔP = 2γ/R</p>
      <p class="text-[18px] text-[#666666] mt-4 text-center">γ ≈ 72.8 mN/m for water at 20°C</p>
    </div>
  </div>
</body>
</html>
