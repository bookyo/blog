<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[20px] text-[#FF6B35] tracking-[0.2em] uppercase font-bold">Why It Matters</p>
    <h2 class="text-[80px] font-black text-white mt-4 leading-none">3-second answers<br/>to 3 AM questions</h2>
    <p class="text-[28px] text-[#cccccc] mt-8 leading-relaxed">A regex parser turns 200 log lines into JSON in 5 seconds. The same answer via Datadog takes 20 minutes of pipeline setup.</p>
    <div class="mt-12 p-8 bg-[#111] border-l-4 border-[#FF6B35]">
      <p class="text-[24px] text-white leading-relaxed"><strong>Debug a 500 storm:</strong> filter <code class="text-[#FF6B35]">status &gt;= 500</code>, group by URL, find the offender in 5 seconds.</p>
    </div>
  </div>
</body>
</html>
