<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[20px] text-[#00B4D8] tracking-[0.2em] uppercase font-bold">The Four Formats</p>
    <h2 class="text-[80px] font-black text-white mt-4 leading-none">CLF, Combined, Nginx, Error</h2>
    <p class="text-[28px] text-[#cccccc] mt-8 leading-relaxed">Three Apache-flavored access formats plus one Nginx error shape. Mixing them produces 0% parse rate.</p>
    <div class="mt-12 grid grid-cols-2 gap-6 text-[22px]">
      <div class="p-6 bg-[#111] border-l-4 border-[#00B4D8]"><strong class="text-white">Common</strong><br/><span class="text-[#999]">9 fields, no referer/UA</span></div>
      <div class="p-6 bg-[#111] border-l-4 border-[#00B4D8]"><strong class="text-white">Combined</strong><br/><span class="text-[#999]">CLF + referer + UA</span></div>
      <div class="p-6 bg-[#111] border-l-4 border-[#00B4D8]"><strong class="text-white">Nginx Default</strong><br/><span class="text-[#999]">Identical to Combined</span></div>
      <div class="p-6 bg-[#111] border-l-4 border-[#00B4D8]"><strong class="text-white">Nginx Error</strong><br/><span class="text-[#999]">Timestamp + level + msg</span></div>
    </div>
  </div>
</body>
</html>
