<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capillary Action Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; }
.formula { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <p class="text-[18px] text-[#666666] tracking-widest uppercase mb-8">Physics · Surface Chemistry · Fluid Dynamics</p>
    <h1 class="text-[130px] font-black text-white tracking-tight leading-none">h ∝ 1/r</h1>
    <p class="text-[48px] font-bold text-[#00FF94] mt-6 tracking-tight">Capillary Action</p>
    <p class="text-[20px] text-[#999999] mt-8 leading-relaxed max-w-[750px] mx-auto">Why water climbs narrow tubes — and why the same force moves blood through your body, ink across paper, and nutrients from root to leaf</p>
    <div class="mt-16 inline-block">
      <p class="text-[14px] text-[#444444]">Formula: h = 2γ·cos(θ) / (ρ·g·r)</p>
      <p class="text-[14px] text-[#444444] mt-1">Jurin's Law · 1718</p>
    </div>
  </div>
</body>
</html>
