<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; background: #0A0A0A; margin: 0; padding: 0; }
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] text-center px-[100px] py-20">
    <p class="text-[20px] font-semibold text-[#00B4D8] tracking-widest uppercase">Card 1 of 3</p>
    <h2 class="text-[88px] font-black text-white mt-6 leading-none">Polygons</h2>
    <p class="text-[56px] font-bold text-[#00B4D8] mt-8 leading-none">P = n &times; s</p>
    <p class="text-[24px] text-[#A0A0A0] mt-10 leading-relaxed" style="max-width:780px;margin-left:auto;margin-right:auto;">Sum the side lengths. That&rsquo;s the whole formula. A regular polygon with n sides of length s has perimeter n &times; s &mdash; no special cases, no exceptions.</p>
    <p class="text-[18px] text-[#666666] mt-12 leading-relaxed">Triangle 3-4-5: P = 12 &middot; Hexagon side 2: P = 12</p>
  </div>
</body>
</html>
