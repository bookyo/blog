<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-[#000D1A] flex items-center justify-center min-h-screen">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[16px] font-bold text-[#00B4D8] tracking-[0.25em] uppercase mb-4">The Trade-off</p>
    <div class="flex items-start gap-12">
      <div class="flex-1">
        <div class="text-[72px] font-black text-[#00B4D8] leading-none">↑</div>
        <p class="text-[22px] font-bold text-white mt-2">Frequency</p>
        <p class="text-[16px] text-[#555555] mt-1">Resolution</p>
      </div>
      <div class="flex-1">
        <div class="text-[72px] font-black text-[#003344] leading-none">↓</div>
        <p class="text-[22px] font-bold text-[#333333] mt-2">Time</p>
        <p class="text-[16px] text-[#333333] mt-1">Resolution</p>
      </div>
    </div>
    <p class="text-[18px] text-[#007799] mt-8 leading-relaxed">Large window = Better frequency precision, poorer time precision.<br>Small window = Better time precision, poorer frequency precision.</p>
  </div>
</body>
</html>
