<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <p class="text-[20px] font-bold text-[#00B4D8] tracking-[0.3em] uppercase mb-6">Signal Processing</p>
    <h1 class="text-[120px] font-black text-white tracking-tight leading-none">STFT</h1>
    <p class="text-[56px] font-bold text-[#00B4D8] mt-4 tracking-tight">You Can't Have Both</p>
    <p class="text-[18px] text-[#666666] mt-10 leading-relaxed">The fundamental trade-off between<br>time resolution and frequency resolution</p>
    <div class="mt-16 flex justify-center gap-6">
      <div class="text-left">
        <p class="text-[12px] text-[#333333] tracking-widest uppercase">Time</p>
        <p class="text-[14px] text-[#555555] mt-1">Precise ✗</p>
      </div>
      <div class="w-px h-10 bg-[#222222] mt-1"></div>
      <div class="text-left">
        <p class="text-[12px] text-[#333333] tracking-widest uppercase">Frequency</p>
        <p class="text-[14px] text-[#555555] mt-1">Precise ✗</p>
      </div>
    </div>
  </div>
</body>
</html>
