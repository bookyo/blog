<body class="bg-[#0d2917] flex items-center justify-center">
  <div class="w-[1080px] px-[108px] py-20">
    <p class="text-[14px] text-[#00FF94] font-bold tracking-widest uppercase mb-6">Section 2</p>
    <h2 class="text-[72px] font-black text-white leading-tight mb-8">Voltage Law</h2>
    <p class="text-[24px] text-white font-semibold leading-relaxed">Around any closed loop, the sum of voltage drops equals the sum of voltage rises — every volt the source provides is accounted for somewhere.</p>
    <div class="mt-10 text-[80px] font-black text-[#00FF94]">ΣV<sub>drops</sub> = ΣV<sub>rises</sub></div>
  </div>
