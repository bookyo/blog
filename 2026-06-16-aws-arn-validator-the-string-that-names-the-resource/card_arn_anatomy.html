<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  background: #0a1628;
  color: #e0f4ff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px;
}
.card {
  max-width: 920px;
  border-left: 6px solid #00d4ff;
  padding-left: 48px;
}
.eyebrow {
  font-size: 16px;
  letter-spacing: 4px;
  color: #00d4ff;
  margin-bottom: 20px;
  font-weight: 700;
}
.title {
  font-size: 42px;
  font-weight: 800;
  margin-bottom: 14px;
  line-height: 1.15;
}
.dek {
  font-size: 18px;
  color: #e0f4ff;
  opacity: 0.75;
  margin-bottom: 32px;
  line-height: 1.5;
}
.bullets {
  list-style: none;
  padding: 0;
}
.bullets li {
  font-size: 17px;
  padding: 9px 0;
  opacity: 0.92;
  line-height: 1.5;
}
.bullets li::before {
  content: "→  ";
  color: #00d4ff;
  font-weight: 700;
}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">STRUCTURE</div>
    <h2 class="title">Seven Segments, One Identifier</h2>
    <p class="dek">The grammar every ARN must satisfy before AWS accepts it</p>
    <ul class="bullets">
      <li>Partition: aws | aws-cn | aws-us-gov</li><li>Service: s3 | iam | ec2 | lambda | sqs</li><li>Region: empty for global, else [a-z]{2}-[a-z]+-d+</li><li>Account ID: empty for global, else exactly 12 digits</li>
    </ul>
  </div>
</body>
</html>
