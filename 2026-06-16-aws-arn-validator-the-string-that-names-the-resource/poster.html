<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0a1a2e 0%, #16213e 100%);
  color: white;
  padding: 80px;
}
.container { text-align: center; max-width: 920px; }
.eyebrow {
  font-size: 18px;
  letter-spacing: 5px;
  color: #ff9900;
  margin-bottom: 32px;
  font-weight: 600;
}
.title {
  font-size: 72px;
  font-weight: 800;
  line-height: 1.05;
  margin-bottom: 32px;
  letter-spacing: -1px;
}
.subtitle {
  font-size: 22px;
  color: #b0c4de;
  font-weight: 300;
  line-height: 1.5;
}
.decorator {
  width: 100px;
  height: 4px;
  background: #ff9900;
  margin: 0 auto 32px auto;
}
</style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">AWS · SECURITY</div>
    <div class="decorator"></div>
    <h1 class="title">The String That<br>Names the Resource</h1>
    <p class="subtitle">An ARN field guide for engineers who treat them as opaque</p>
  </div>
</body>
</html>
