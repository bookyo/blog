<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyroscopic Precession Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <!-- Core focal point: giant omega symbol -->
    <div class="text-[160px] font-black text-white tracking-tight leading-none">Ω</div>
    <!-- Precession rate formula -->
    <p class="text-[36px] font-bold text-[#00FF94] mt-6 tracking-tight font-mono">Ω = mgr / Iω</p>
    <!-- Sub text -->
    <p class="text-[28px] font-semibold text-white mt-8 tracking-tight">Why Spinning Objects<br/>Don't Fall When They Should</p>
    <!-- Descriptor -->
    <p class="text-[18px] text-[#666666] mt-10 leading-relaxed">Angular Momentum · Torque · Nutation</p>
    <!-- Bottom label -->
    <p class="text-[14px] text-[#444444] mt-16 tracking-widest uppercase">Physics Visualization · ElysiaTools</p>
  </div>
</body>
</html>
