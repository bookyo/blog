<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a1628] flex items-center justify-center">
  <div class="w-[1080px] text-left px-[80px] py-20">
    <p class="text-[#00B4D8] text-[18px] font-semibold tracking-widest uppercase mb-4">Card 1 / 3</p>
    <h2 class="text-[64px] font-black text-white leading-tight">4,186 J/(kg·°C)</h2>
    <p class="text-[#8ab4d4] text-[22px] font-semibold mt-4">Water's Specific Heat</p>
    <p class="text-[#8899aa] text-[18px] mt-6 leading-relaxed">It takes 4,186 joules to raise 1 kg of water by just 1°C. This is why oceans absorb heat without boiling — and why your body uses water to cool down.</p>
    <div class="mt-10 border-l-4 border-[#00B4D8] pl-6 py-2">
      <p class="text-[#556677] text-[16px] italic">5× more heat capacity than sand, 30× more than lead</p>
    </div>
  </div>
</body>
</html>
