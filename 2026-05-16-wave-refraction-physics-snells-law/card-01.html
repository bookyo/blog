<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snell's Law Card</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000D1A;
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  padding: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: #00B4D8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 88px; font-weight: 900; color: #00B4D8;
  line-height: 0.92; letter-spacing: -2px; margin-bottom: 32px; }
.equation { font-size: 48px; font-weight: 700; color: #ffffff;
  font-family: 'JetBrains Mono', monospace; margin-bottom: 32px; }
.quote { font-size: 20px; color: #aaa; line-height: 1.5;
  border-left: 3px solid #00B4D8; padding-left: 24px; margin-bottom: 36px; }
.bullets { display: flex; flex-direction: column; gap: 12px; }
.bullet { display: flex; align-items: center; gap: 14px; font-size: 17px; color: #ddd; }
.bullet-dot { width: 8px; height: 8px; border-radius: 50%;
  background: #00B4D8; flex-shrink: 0; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">The Governing Law</div>
  <div class="label">Part 01</div>
  <h1 class="title">Snell's Law</h1>
  <div class="equation">n₁ · sin(θ₁) = n₂ · sin(θ₂)</div>
  <p class="quote">"Works identically for light, sound, ocean swells, and seismic waves."</p>
  <div class="bullets">
    <div class="bullet"><div class="bullet-dot"></div>1621: derived by Dutch mathematician Willebrord Snell</div>
    <div class="bullet"><div class="bullet-dot"></div>θ₁ = incident angle, θ₂ = refracted angle</div>
    <div class="bullet"><div class="bullet-dot"></div>Higher n = slower medium = more bending</div>
  </div>
</div>
</body>
</html>
