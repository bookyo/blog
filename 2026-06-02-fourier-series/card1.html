  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[16px] text-[#00B4D8] font-semibold tracking-widest uppercase mb-6">Epicycles</p>
    <h2 class="text-[72px] font-black text-white leading-none mb-8">One Circle traces a Point.<br/>Many Circles trace a Wave.</h2>
    <p class="text-[22px] text-[#94a3b8] leading-relaxed">Each Fourier coefficient is an epicycle — a circle riding on another circle. The DFT extracts the radius and spin rate of each circle from your drawn curve.</p>
