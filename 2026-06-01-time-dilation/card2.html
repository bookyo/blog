<body>
<div class="card">
<div class="accent">COSMIC RAYS</div>
<div class="title">Why Muons Reach the Ground</div>
<div class="body">A muon at 0.98c has a mean lifetime of 2.2 μs in its own frame. In ours, time stretches by γ ≈ 5 — so 11 μs of our time, enough to travel 3,200 meters. Without time dilation, muons would decay at 660 meters. They reach sea level anyway.</div>
<div class="equation">γ = 5 at v = 0.98c</div>
</div>
