<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card 1</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000D1A;
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  padding: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: #00B4D8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 72px; font-weight: 900; color: #00B4D8;
  line-height: 0.92; letter-spacing: -2px; margin-bottom: 32px; }
.quote { font-size: 20px; color: #ccc; line-height: 1.5;
  border-left: 3px solid #00B4D8; padding-left: 24px; margin-bottom: 36px; font-style: italic; }
.bullets { display: flex; flex-direction: column; gap: 12px; }
.bullet { display: flex; align-items: center; gap: 14px; font-size: 17px; color: #ddd; }
.bullet-dot { width: 8px; height: 8px; border-radius: 50%;
  background: #00B4D8; flex-shrink: 0; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">Core Principle</div>
  <div class="label">Part 01</div>
  <h1 class="title">A Teaspoon Weighs<br>as Much as<br>Mount Everest</h1>
  <p class="quote">"10¹⁸ kg/m³ — density of a neutron star"</p>
  <div class="bullets">
    <div class="bullet"><div class="bullet-dot"></div>10 km radius (size of Manhattan)</div>
    <div class="bullet"><div class="bullet-dot"></div>1.4 solar masses typical</div>
    <div class="bullet"><div class="bullet-dot"></div>Degenerate neutron matter supported by neutron degeneracy pressure</div>
    <div class="bullet"><div class="bullet-dot"></div>Cross 2.17 M☉ and it collapses into a black hole</div>
  </div>
</div>
</body>
</html>
