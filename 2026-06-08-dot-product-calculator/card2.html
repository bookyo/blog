<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[26px] font-bold text-[#00B4D8] tracking-widest uppercase mb-6">02 &middot; The Geometry</p>
    <p class="text-[60px] font-black text-white leading-tight mb-8">One number &mdash; five hidden meanings.</p>
    <div class="space-y-4 mt-8">
      <div class="flex items-baseline"><span class="mono text-[36px] text-[#00FF94] w-[260px]">a &middot; b &gt; 0</span><span class="text-[32px] text-white">vectors point in similar directions</span></div>
      <div class="flex items-baseline"><span class="mono text-[36px] text-[#00FF94] w-[260px]">a &middot; b = 0</span><span class="text-[32px] text-white">perpendicular &mdash; nothing in common</span></div>
      <div class="flex items-baseline"><span class="mono text-[36px] text-[#00FF94] w-[260px]">a &middot; b &lt; 0</span><span class="text-[32px] text-white">opposite directions</span></div>
      <div class="flex items-baseline"><span class="mono text-[36px] text-[#00FF94] w-[260px]">a &middot; b = |a||b|</span><span class="text-[32px] text-white">parallel (cos &theta; = 1)</span></div>
      <div class="flex items-baseline"><span class="mono text-[36px] text-[#00FF94] w-[260px]">a &middot; b / (|a||b|)</span><span class="text-[32px] text-white">cosine similarity &mdash; direction only</span></div>
    </div>
  </div>
</body>
</html>
