<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[26px] font-bold text-[#00B4D8] tracking-widest uppercase mb-6">01 &middot; The Formula</p>
    <p class="text-[64px] font-black text-white leading-tight mb-8">Multiply matching components, then add them up. That is the whole definition.</p>
    <div class="bg-[#0a0a0a] border-l-4 border-[#00FF94] px-10 py-8 my-8">
      <p class="mono text-[52px] text-[#00FF94]">a &middot; b = a&#8321;b&#8321; + a&#8322;b&#8322; + &hellip; + a&#8345;b&#8345;</p>
    </div>
    <p class="text-[28px] text-[#aaaaaa] leading-relaxed">For <span class="mono text-[#00FF94]">a = (1, 2, 3)</span> and <span class="mono text-[#00FF94]">b = (4, 5, 6)</span>: 4 + 10 + 18 = <span class="mono text-white text-[36px] font-bold">32</span>. One number captures the relationship between two vectors.</p>
  </div>
</body>
</html>
