<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1280px; min-height: 900px; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] mx-auto px-12 py-16">
    <p class="text-[#FF6B35] text-[24px] font-semibold tracking-widest uppercase">The Rewrite</p>
    <h2 class="text-white text-[80px] font-black leading-tight mt-4">Three Fixes That Cover Most Cases</h2>
    <div class="mt-10 space-y-6 text-[28px] text-[#CCCCCC] leading-snug">
      <p><span class="text-[#FF6B35] font-bold">1. Anchor</span> &mdash; add <code class="text-[#FF6B35]">^...$</code> to fix the input range</p>
      <p><span class="text-[#FF6B35] font-bold">2. Specify</span> &mdash; replace <code class="text-[#FF6B35]">.*</code> with <code class="text-[#FF6B35]">[^"]*</code></p>
      <p><span class="text-[#FF6B35] font-bold">3. Drop the outer group</span> &mdash; <code class="text-[#FF6B35]">(a+)+$</code> becomes <code class="text-[#FF6B35]">a+$</code></p>
    </div>
  </div>
</body>
</html>
