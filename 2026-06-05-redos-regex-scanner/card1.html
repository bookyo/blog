<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1280px; min-height: 900px; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] mx-auto px-12 py-16">
    <p class="text-[#FF6B35] text-[24px] font-semibold tracking-widest uppercase">The Three Patterns</p>
    <h2 class="text-white text-[80px] font-black leading-tight mt-4">What Keeps Biting Engineers</h2>
    <div class="mt-10 space-y-5 text-[28px] text-[#CCCCCC] leading-snug">
      <p><span class="text-[#FF6B35] font-bold">(a+)+$</span> &mdash; nested quantifiers</p>
      <p><span class="text-[#FF6B35] font-bold">(a|a)+$</span> &mdash; alternation in a group</p>
      <p><span class="text-[#FF6B35] font-bold">.*foo.*</span> &mdash; greedy wildcard sandwich</p>
    </div>
  </div>
</body>
</html>
