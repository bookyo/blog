<!DOCTYPE html>

<style>
body { font-family: 'Outfit', sans-serif; width: 1280px; min-height: 900px; }
</style>

<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] mx-auto px-12 py-16">

    <div class="mt-10 grid grid-cols-3 gap-8 text-[24px] text-[#CCCCCC]">
      <div><p class="text-[#FF6B35] text-[64px] font-black">14</p><p>characters in the regex</p></div>
      <div><p class="text-[#FF6B35] text-[64px] font-black">4%</p><p>CPU before the spike</p></div>
      <div><p class="text-[#FF6B35] text-[64px] font-black">90m</p><p>time to recover</p></div>
    </div>
  </div>
