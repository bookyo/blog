<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
.code {
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[22px] text-[#00B4D8] tracking-[0.3em] font-bold">SECTION 02 — THE ALGORITHM</p>
    <h2 class="text-[64px] font-black text-white tracking-tight leading-tight mt-6">One inequality,<br/>applied pairwise</h2>
    <div class="bg-[#0A0A0A] border-l-[6px] border-[#00B4D8] px-8 py-7 mt-10 rounded">
      <p class="code text-[34px] text-[#00FF94] leading-relaxed">A overlaps B if</p>
      <p class="code text-[34px] text-white leading-relaxed mt-3">A.start <span class="text-[#00FF94]">&lt;</span> B.end<br/>&nbsp;&nbsp;&nbsp;&nbsp;<span class="text-[#FF6B35]">AND</span><br/>B.start <span class="text-[#00FF94]">&lt;</span> A.end</p>
    </div>
    <p class="text-[24px] text-[#BBBBBB] mt-10 leading-relaxed">For 30 ranges, that's 435 pairwise checks. The tool returns every match in under a second — no human fatigue required.</p>
  </div>
</body>
</html>
