<h2 class="text-[80px] font-black text-white leading-none mt-4">A MAP OF<br>HOW CODE<br>IS READ</h2>
<div class="mt-12 space-y-5 text-white text-[24px]">
<p><span class="text-[#00FF94] font-bold">camelCase</span> <span class="text-[#888]">— built for the eyes (JS, Java)</span></p>
<p><span class="text-[#00FF94] font-bold">snake_case</span> <span class="text-[#888]">— built for the fingers (Python, Ruby)</span></p>
<p><span class="text-[#00FF94] font-bold">PascalCase</span> <span class="text-[#888]">— the one-capital-letter type system</span></p>
<p><span class="text-[#00FF94] font-bold">kebab-case</span> <span class="text-[#888]">— the seam outside the language (HTML, CSS, URLs)</span></p>
