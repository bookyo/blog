    <h2 class="text-[72px] font-black text-white leading-tight">τ = L/R</h2>
    <p class="text-[28px] font-semibold text-[#00FF94] mt-6">The RL Time Constant</p>
    <p class="text-[20px] text-[#8888aa] mt-8 leading-relaxed">The time constant τ tells you how fast a circuit responds. A larger inductance means a larger τ and a slower transient. A larger resistance means a smaller τ and a faster response. All practical circuits are tuned by this ratio.</p>
