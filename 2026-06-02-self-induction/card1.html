<body class="bg-[#0a0e27] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[16px] font-bold text-[#00B4D8] tracking-[0.3em] uppercase mb-6">Card 01</p>
    <h2 class="text-[72px] font-black text-white leading-tight">ε = −L · dI/dt</h2>
    <p class="text-[28px] font-semibold text-[#00FF94] mt-6">The Back-EMF Equation</p>
    <p class="text-[20px] text-[#8888aa] mt-8 leading-relaxed">Faraday's law for a single coil: the induced EMF equals negative inductance times the rate of change of current. The minus sign is Lenz's law in mathematical form — the coil always pushes back.</p>
