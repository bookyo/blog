<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
}
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] px-[108px] py-20 text-center">
    <p class="text-[22px] font-bold text-[#00B4D8] tracking-widest uppercase mb-6">Virtual Image</p>
    <h2 class="text-[90px] font-black text-white leading-none">Same Distance</h2>
    <h2 class="text-[90px] font-black text-[#00B4D8] leading-none">Same Size</h2>
    <p class="text-[20px] text-gray-400 mt-8 leading-relaxed">The image forms exactly as far behind the mirror as the object is in front. No magnification. No distortion.</p>
  </div>
</body>
</html>
