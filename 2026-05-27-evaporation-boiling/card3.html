<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#20100a] flex items-center justify-center">
  <div class="w-[1080px] text-left px-[80px] py-20">
    <p class="text-[16px] font-bold text-[#FF6B35] tracking-[0.2em] uppercase mb-6">Boiling Point Is Not Fixed</p>
    <h2 class="text-[56px] font-black text-white leading-tight mb-6">Pressure Controls Temperature</h2>
    <p class="text-[22px] text-[#fdba74] leading-relaxed">1 atm → 100°C | 0.33 atm → 70°C | 2 atm → 120°C</p>
    <div class="mt-10 flex items-center gap-4">
      <div class="w-[60px] h-[4px] bg-[#FF6B35]"></div>
      <p class="text-[16px] text-[#475569]">Pressure cookers raise the boiling point to cook faster</p>
    </div>
  </div>
</body>
</html>
