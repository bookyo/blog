<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#0a1628] flex items-center justify-center">
  <div class="w-[1080px] text-left px-[80px] py-20">
    <p class="text-[16px] font-bold text-[#00B4D8] tracking-[0.2em] uppercase mb-6">Surface vs Volume</p>
    <h2 class="text-[64px] font-black text-white leading-tight mb-6">Evaporation Is a Surface Event</h2>
    <p class="text-[22px] text-[#94a3b8] leading-relaxed">Boiling Is a Volume Event</p>
    <div class="mt-10 flex items-center gap-4">
      <div class="w-[60px] h-[4px] bg-[#00B4D8]"></div>
      <p class="text-[16px] text-[#475569]">At any temperature, the fastest molecules escape the surface</p>
    </div>
  </div>
</body>
</html>
