<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 600px; }</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-sm font-bold text-[#FF6B35] tracking-widest uppercase mb-4">Universal Gates</p>
    <h2 class="text-[72px] font-black text-white leading-tight">H, X, Y, Z, S, T, CNOT</h2>
    <p class="text-[28px] text-gray-400 mt-6 leading-relaxed">Hadamard creates superposition. CNOT creates entanglement. Together they are universal.</p>
    <p class="text-[20px] text-gray-500 mt-8">Any unitary transformation can be decomposed into these seven elementary operations.</p>
  </div>
</body>
</html>
