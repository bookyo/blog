<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-sm font-bold text-[#00FF94] tracking-widest uppercase mb-4">Core Concept</p>
    <h2 class="text-[72px] font-black text-white leading-tight">The Bloch Sphere</h2>
    <p class="text-[28px] text-gray-400 mt-6 leading-relaxed">|ψ⟩ = cos(θ/2)|0⟩ + e^(iφ)sin(θ/2)|1⟩</p>
    <p class="text-[20px] text-gray-500 mt-8">Every point on the sphere is a valid quantum state. Every rotation is a reversible gate operation.</p>
  </div>
