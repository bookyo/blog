<body class="flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[20px] text-[#666] tracking-widest uppercase mb-4">Card 1 of 3</p>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-[0.95] mb-6">IQR: ASSUMPTION-LIGHT</h2>
    <p class="text-[36px] font-bold text-[#00FF94] tracking-tight mb-10">Simple, symmetric, often wrong</p>
    <p class="text-[26px] text-[#cccccc] leading-relaxed">The 1.5×IQR fence ignores how far the outlier actually is. 0.1 past the fence counts the same as 100 past it. The rule is binary — fence or no fence — and that simplicity is its only real strength.</p>
  </div>
