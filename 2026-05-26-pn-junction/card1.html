<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:Outfit,sans-serif;width:1080px;min-height:600px;background:#0a1628;}</style>
</head>
<body class="flex items-center justify-center">
<div class="w-[1080px] px-16 py-12">
  <div class="text-[#00B4D8] text-[16px] font-bold tracking-widest uppercase mb-4">Key Concept</div>
  <h2 class="text-[72px] font-black text-white leading-tight">The Depletion Region</h2>
  <p class="text-[28px] text-[#94a3b8] mt-6 leading-relaxed">A ~1 μm boundary where fixed ions create an electric field that opposes diffusion — the entire mechanism of the PN junction, visible only through physics.</p>
  <div class="mt-10 flex gap-6">
    <div class="bg-[#1e3a5f] rounded-2xl px-6 py-4"><div class="text-[#00FF94] text-[14px] font-bold">Built-in Potential</div><div class="text-white text-[20px] font-bold mt-1">V<sub>bi</sub> ≈ 0.7V</div></div>
    <div class="bg-[#1e3a5f] rounded-2xl px-6 py-4"><div class="text-[#00FF94] text-[14px] font-bold">Depletion Width</div><div class="text-white text-[20px] font-bold mt-1">W ~ 0.1–1 μm</div></div>
    <div class="bg-[#1e3a5f] rounded-2xl px-6 py-4"><div class="text-[#00FF94] text-[14px] font-bold">Thermal Voltage</div><div class="text-white text-[20px] font-bold mt-1">kT/e ≈ 26 mV</div></div>
  </div>
</div>
</body>
</html>
