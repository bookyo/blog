<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1280px;
  height: 720px;
  background: #000000;
  margin: 0;
  padding: 60px 80px;
}
</style>
</head>
<body>
  <p class="text-[#FF6B35] text-[24px] font-bold tracking-widest uppercase mb-4">Time savings</p>
  <h2 class="text-white text-[80px] font-black leading-tight mb-10">8 min &rarr; 30 sec</h2>
  <div class="grid grid-cols-3 gap-6">
    <div class="border border-[#FF6B35] rounded-lg p-6">
      <p class="text-[#FF6B35] text-[28px] font-bold mb-2">API reference</p>
      <p class="text-[#cccccc] text-[22px] leading-snug">JSON schema dump to GitHub-ready table. About 5 seconds per table.</p>
    </div>
    <div class="border border-[#FF6B35] rounded-lg p-6">
      <p class="text-[#FF6B35] text-[28px] font-bold mb-2">Status reports</p>
      <p class="text-[#cccccc] text-[22px] leading-snug">Monthly metrics CSV pasted into a stakeholder report. No pipe counting.</p>
    </div>
    <div class="border border-[#FF6B35] rounded-lg p-6">
      <p class="text-[#FF6B35] text-[28px] font-bold mb-2">GitHub issues</p>
      <p class="text-[#cccccc] text-[22px] leading-snug">Query result to issue table. Renders correctly across all Markdown viewers.</p>
    </div>
  </div>
</body>
</html>
