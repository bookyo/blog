<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  background: #0a0a0a;
  margin: 0;
  color: #ffffff;
}
.mono {
  font-family: 'JetBrains Mono', monospace;
}
.accent {
  color: #00B4D8;
}
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <div class="flex items-center justify-between mb-10">
      <p class="mono text-[20px] tracking-[0.3em] accent">QUARTZ</p>
      <p class="mono text-[18px] text-[#666]">2/3</p>
    </div>
    <h2 class="mono text-[80px] font-bold tracking-tight leading-none mb-4">0 0/15 * * * ?</h2>
    <p class="text-[36px] font-semibold text-white mt-4">Every 15 minutes</p>
    <p class="text-[22px] text-[#aaa] mt-8 leading-relaxed max-w-[900px]">Six-field Quartz syntax. The `?` is required in day-of-week when day-of-month is `*`. Parse as standard cron and you get a syntax error.</p>
    <div class="mt-16 flex items-center gap-3">
      <div class="w-3 h-3 rounded-full" style="background:#00B4D8"></div>
      <p class="mono text-[14px] text-[#555]">CRON EXPRESSION VISUALIZER</p>
    </div>
  </div>
</body>
</html>
