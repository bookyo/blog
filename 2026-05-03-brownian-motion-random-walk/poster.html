<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <!-- Core focus: large white title -->
    <h1 class="text-[120px] font-black text-white tracking-tight leading-none">√n</h1>

    <!-- Description -->
    <p class="text-[18px] text-[#666666] mt-10 leading-relaxed">From pollen grains to stock prices — why the square root governs how far random things wander</p>

    <p class="text-[28px] font-mono text-[#444444] mt-12">⟨x²⟩ = 2Dt</p>
    <!-- ElysiaTools -->
    <p class="text-[14px] text-[#333333] mt-16 tracking-widest uppercase">ElysiaTools</p>
  </div>
</body>
</html>
