<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a2818] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[16px] font-bold text-[#00FF94] tracking-[0.2em] uppercase mb-6">The Counterintuitive Part</p>
    <h2 class="text-[72px] font-black text-white leading-[1.0]">Smaller Is<br/>Not Sharper</h2>
    <p class="text-[28px] font-light text-[#94c4a4] mt-8 leading-relaxed">Below 0.3mm, diffraction takes over — light bends around the edges of the hole instead of passing through cleanly. The sweet spot is 0.3–0.5mm.</p>
    <div class="mt-10 flex justify-center items-end gap-12">
      <div class="text-center">
        <div class="text-[48px] font-bold text-[#00FF94]">0.1mm</div>
        <div class="text-[16px] text-[#64748b]">too small</div>
      </div>
      <div class="text-center">
        <div class="text-[48px] font-bold text-[#00FF94]">0.4mm</div>
        <div class="text-[16px] text-[#64748b]">sweet spot</div>
      </div>
      <div class="text-center">
        <div class="text-[48px] font-bold text-[#64748b]">1.0mm</div>
        <div class="text-[16px] text-[#64748b]">too large</div>
      </div>
    </div>
  </div>
</body>
</html>
