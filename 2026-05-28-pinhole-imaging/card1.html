<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a1628] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[16px] font-bold text-[#00B4D8] tracking-[0.2em] uppercase mb-6">The Core Rule</p>
    <h2 class="text-[72px] font-black text-white leading-[1.0]">Rectilinear Propagation</h2>
    <p class="text-[28px] font-light text-[#94a3b8] mt-8 leading-relaxed">Light travels in perfectly straight lines. Every single point on an object maps to a corresponding point on the image — through nothing but a tiny hole.</p>
    <div class="mt-12 flex justify-center">
      <div class="text-[120px] font-black text-[#00B4D8]">→</div>
    </div>
    <p class="text-[20px] text-[#64748b] mt-6">No bending. No tricks. Pure geometry.</p>
  </div>
</body>
</html>
