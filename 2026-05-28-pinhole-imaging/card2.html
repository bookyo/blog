<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#1a0a28] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[16px] font-bold text-[#FF6B35] tracking-[0.2em] uppercase mb-6">The Surprise</p>
    <h2 class="text-[72px] font-black text-white leading-[1.0]">The Image<br/>Is Inverted</h2>
    <p class="text-[28px] font-light text-[#d4a29a] mt-8 leading-relaxed">Top becomes bottom, bottom becomes top — not because of some optical trick, but because straight lines crossing an aperture have no choice.</p>
    <div class="mt-12 flex justify-center items-center gap-8">
      <div class="text-[60px] font-bold text-[#FF6B35]">↑ top</div>
      <div class="text-[40px] text-[#64748b]">→</div>
      <div class="text-[60px] font-bold text-[#FF6B35]">↓ bottom</div>
    </div>
    <p class="text-[20px] text-[#64748b] mt-8">Geometry, not glass</p>
  </div>
</body>
</html>
