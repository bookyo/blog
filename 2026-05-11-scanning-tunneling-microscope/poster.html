<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STM Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <p class="text-[14px] font-mono text-[#666666] tracking-[6px] uppercase mb-8">Physics Visualization</p>
    <h1 class="text-[130px] font-black text-white tracking-tight leading-none">STM</h1>
    <p class="text-[52px] font-bold text-[#00B4D8] mt-6 tracking-tight">Scanning Tunneling Microscope</p>
    <p class="text-[17px] text-[#666666] mt-10 leading-relaxed max-w-[750px] mx-auto">See atoms with your own eyes. Interactive visualization of quantum tunneling and atomic-resolution imaging based on Nobel-winning physics.</p>
    <div class="mt-12 flex items-center justify-center gap-3">
      <div class="w-2 h-2 rounded-full bg-[#00B4D8]"></div>
      <p class="text-[13px] font-mono text-[#444444] tracking-widest uppercase">0.1 nm Resolution</p>
    </div>
  </div>
</body>
</html>
