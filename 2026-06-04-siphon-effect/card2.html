<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-left px-[108px] py-24">
    <p class="text-[24px] font-bold text-[#00FF94] tracking-widest">CARD 02</p>
    <h2 class="text-[88px] font-black text-white tracking-tight leading-none mt-6">√2x</h2>
    <p class="text-[36px] font-bold text-white mt-8 leading-tight">Why doubling the height drop only speeds flow by 41%</p>
    <p class="text-[20px] text-[#999999] mt-8 leading-relaxed">Torricelli's law v = √(2g·Δh) means velocity grows with the square root, not linearly. A 1 m drop gives 4.43 m/s; a 2 m drop gives 6.26 m/s.</p>
