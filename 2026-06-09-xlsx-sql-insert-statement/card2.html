<body class="flex items-center justify-center">
  <div class="px-[80px] py-20">
    <p class="text-[24px] text-[#00FF94] font-bold tracking-[0.25em] uppercase mb-6">RULE 02 &middot; NULL</p>
    <h2 class="text-[100px] font-extrabold text-white leading-[1.0] mb-8">Empty cell</h2>
    <h2 class="text-[100px] font-extrabold text-[#00FF94] leading-[1.0] mb-8">&ne; Zero.</h2>
    <p class="text-[36px] text-[#999999] leading-snug mt-6">A blank cell is NULL. A cell with the formula <span class="text-white font-bold">=B2-B2</span> is the integer 0.<br/>Treat them the same and the report lies.</p>
  </div>
