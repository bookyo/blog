<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electromagnetic Spectrum Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <!-- Spectrum bands visualization bar -->
    <div class="flex items-center justify-center gap-0 mb-12">
      <div class="h-4 flex-1" style="background:#ff4444;"></div>
      <div class="h-4 flex-1" style="background:#ff8800;"></div>
      <div class="h-4 flex-1" style="background:#990000;"></div>
      <div class="h-4 flex-1" style="background:#ff0000;"></div>
      <div class="h-4 flex-1" style="background:#ffcc00;"></div>
      <div class="h-4 flex-1" style="background:#00ff00;"></div>
      <div class="h-4 flex-1" style="background:#00ccff;"></div>
      <div class="h-4 flex-1" style="background:#0044ff;"></div>
      <div class="h-4 flex-1" style="background:#8800ff;"></div>
    </div>
    <div class="flex text-[10px] text-[#666] justify-between px-2 mb-8">
      <span>Radio</span>
      <span>Microwave</span>
      <span>Infrared</span>
      <span class="text-white font-bold">Visible</span>
      <span>UV</span>
      <span>X-Ray</span>
      <span>Gamma</span>
    </div>

    <h1 class="text-[120px] font-black text-white tracking-tight leading-none">SPECTRUM</h1>
    <p class="text-[48px] font-bold text-[#00B4D8] mt-4 tracking-tight">15 Orders of Magnitude</p>
    <p class="text-[18px] text-[#666666] mt-10 leading-relaxed">From radio waves taller than mountains to gamma rays<br/>smaller than atomic nuclei — the physics that runs everything.</p>

    <!-- Formula decoration -->
    <div class="mt-12 font-mono text-[14px] text-[#444]">
      <span class="text-[#00B4D8]">c = λf</span>
      <span class="mx-4">·</span>
      <span class="text-[#00FF94]">E = hf</span>
    </div>
  </div>
</body>
</html>
