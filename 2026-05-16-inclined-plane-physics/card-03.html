<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000D1A; font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; padding: 80px; display: flex; align-items: center; justify-content: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #00B4D8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 72px; font-weight: 900; color: #00B4D8; line-height: 0.92; letter-spacing: -2px; margin-bottom: 32px; }
.quote { font-size: 20px; color: #ccc; line-height: 1.5; border-left: 3px solid #00B4D8; padding-left: 24px; margin-bottom: 36px; }
.bullets { display: flex; flex-direction: column; gap: 12px; }
.bullet { display: flex; align-items: center; gap: 14px; font-size: 17px; color: #ddd; }
.bullet-dot { width: 8px; height: 8px; border-radius: 50%; background: #00B4D8; flex-shrink: 0; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">Hidden in Plain Sight</div>
  <div class="label">Part 03</div>
  <h1 class="title">Roads, Stairs,<br>Screws, Blades</h1>
  <p class="quote">"The moment you know what to look for, the inclined plane is everywhere."</p>
  <div class="bullets">
    <div class="bullet"><div class="bullet-dot"></div>Switchback roads trade distance for gradeability</div>
    <div class="bullet"><div class="bullet-dot"></div>Stairs: rise/run ratio set by building codes at ~33°</div>
    <div class="bullet"><div class="bullet-dot"></div>A screw is an inclined plane wrapped around a cylinder</div>
  </div>
</div>
</body>
</html>
