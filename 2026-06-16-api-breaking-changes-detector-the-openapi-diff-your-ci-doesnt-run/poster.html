<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      width: 1080px;
      min-height: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0a1a 0%, #1a0a2e 50%, #16213e 100%);
      color: white;
      padding: 60px;
      position: relative;
      overflow: hidden;
    }
    .container { text-align: center; max-width: 900px; z-index: 2; }
    .eyebrow { font-size: 14px; letter-spacing: 4px; color: #a855f7; margin-bottom: 32px; font-weight: 600; }
    .title { font-size: 56px; font-weight: 800; line-height: 1.1; margin-bottom: 24px; }
    .accent { color: #00d4ff; }
    .subtitle { font-size: 22px; color: #c0c0e0; font-weight: 300; line-height: 1.5; }
    .bg-shape {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(168,85,247,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0,212,255,0.12) 0%, transparent 50%);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-shape"></div>
  <div class="container">
    <div class="eyebrow">DEVELOPER &middot; API CONTRACT</div>
    <h1 class="title">The OpenAPI Diff <span class="accent">Your CI Does Not Run</span></h1>
    <p class="subtitle">Why two specs can look compatible and still break every client</p>
  </div>
</body>
</html>
