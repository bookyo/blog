<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body {
 font-family: 'Outfit', sans-serif;
 width:1080px;
 min-height:900px;
 margin:0;
 padding:0;
}
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-[#0A0A0A] flex items-center justify-center">
 <div class="w-[1080px] px-[72px] py-20">
 <p class="text-[26px] font-bold text-[#00FF94] tracking-widest uppercase mb-3">Worked Example</p>
 <p class="text-[56px] font-black text-white leading-tight mb-10">A TypeScript glob, translated</p>
 <div class="bg-[#1A1A1A] border-2 border-[#00FF94] rounded-2xl p-10 mb-8">
 <p class="mono text-[28px] text-[#00FF94] font-bold">src/**/*.{ts,tsx}</p>
 </div>
 <div class="bg-[#1A1A1A] border border-[#333333] rounded-2xl p-10">
 <p class="text-[22px] text-[#888888] uppercase tracking-wider font-bold mb-4">becomes</p>
 <p class="mono text-[32px] text-white font-bold">^src/.*/[^/]*\.(ts|tsx)$</p>
 </div>
 <p class="text-[24px] text-[#CCCCCC] mt-10 leading-relaxed">7 steps. Every judgment call made explicit.</p>
 </div>
</body>
</html>
