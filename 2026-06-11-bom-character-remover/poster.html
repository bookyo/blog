<!DOCTYPE html>
<html lang="en">
<head>

<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] text-center px-[108px] py-24">

    <p class="text-[36px] font-bold text-[#00FF94] mt-6 tracking-tight leading-tight">
