<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20 text-white">
    <p class="text-[28px] text-[#00FF94] font-semibold tracking-widest">DUBLIN, 1898</p>
    <h2 class="text-[88px] font-black text-white mt-6 leading-tight">100 units in.<br/>10 units out.</h2>
    <p class="text-[28px] text-[#CCCCCC] mt-8 leading-relaxed">A steam plant loses 90% of its fuel as heat. The engineer draws ribbons proportional to each flow. The board finally sees the waste.</p>
    <div class="mt-12">
      <div class="bg-[#00FF94] h-[28px] mb-3" style="width: 100px;"></div>
      <p class="text-[20px] text-[#666]">to dynamo: 10</p>
      <div class="bg-[#00FF94] h-[28px] mt-6" style="width: 800px;"></div>
      <p class="text-[20px] text-[#666]">to waste heat: 90</p>
    </div>
  </div>
</body>
</html>
