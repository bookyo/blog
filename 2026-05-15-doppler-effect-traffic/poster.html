<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <p class="text-[14px] text-[#666666] tracking-[6px] uppercase mb-8">Physics · Acoustics · Motion</p>
    <h1 class="text-[130px] font-black text-white tracking-tight leading-none">f' = f</h1>
    <p class="text-[60px] font-bold text-[#00FF94] mt-4 tracking-tight">The Doppler Effect</p>
    <p class="text-[22px] text-[#888888] mt-10 leading-relaxed">Why an ambulance siren drops in pitch when it passes you — and why that drop is one of the most elegant equations in physics.</p>
    <div class="mt-16 flex justify-center gap-6">
      <div class="text-center">
        <div class="text-[48px] font-black text-white">+100 Hz</div>
        <div class="text-[12px] text-[#555555] tracking-widest uppercase mt-1">Approaching</div>
      </div>
      <div class="text-center text-[#333333] text-[48px] font-light">|</div>
      <div class="text-center">
        <div class="text-[48px] font-black text-white">−100 Hz</div>
        <div class="text-[12px] text-[#555555] tracking-widest uppercase mt-1">Receding</div>
      </div>
    </div>
  </div>
</body>
</html>
