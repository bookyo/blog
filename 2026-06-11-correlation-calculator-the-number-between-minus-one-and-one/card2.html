<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1280px; min-height: 720px; }
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1280px] px-[80px] py-20">
    <p class="text-[24px] font-medium text-[#00FF94] tracking-[0.2em] uppercase">02 / What the bounds mean</p>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-none mt-4">The Number Is Bounded</h2>
    <div class="flex items-end justify-between mt-12 px-8">
      <div class="text-center">
        <p class="text-[120px] font-black text-[#00FF94] leading-none">+1</p>
        <p class="text-[24px] text-[#cccccc] mt-4">Perfect lockstep</p>
      </div>
      <div class="text-center">
        <p class="text-[120px] font-black text-white leading-none">0</p>
        <p class="text-[24px] text-[#cccccc] mt-4">No linear relationship</p>
      </div>
      <div class="text-center">
        <p class="text-[120px] font-black text-[#FF6B35] leading-none">-1</p>
        <p class="text-[24px] text-[#cccccc] mt-4">Perfect opposition</p>
      </div>
    </div>
    <p class="text-[22px] text-[#888888] mt-12 text-center">Scale-free. Same answer in inches or centimeters. The covariance is in inch-pounds. The correlation is unit-free.</p>
  </div>
</body>
</html>
