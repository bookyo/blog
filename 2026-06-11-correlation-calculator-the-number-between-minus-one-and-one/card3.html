<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1280px; min-height: 720px; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1280px] px-[80px] py-20">
    <p class="text-[24px] font-medium text-[#00FF94] tracking-[0.2em] uppercase">03 / Five Students, Two Numbers</p>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-none mt-4">A Worked Example</h2>
    <div class="mt-12 bg-[#1a1a1a] border border-[#333333] p-8 rounded-lg">
      <p class="mono text-[24px] text-[#00FF94]">Hours:  &nbsp;1 &nbsp;&nbsp; 2 &nbsp;&nbsp; 3 &nbsp;&nbsp; 4 &nbsp;&nbsp; 5</p>
      <p class="mono text-[24px] text-white mt-3">Score: 60 &nbsp; 65 &nbsp; 70 &nbsp; 80 &nbsp; 95</p>
      <div class="mt-8 grid grid-cols-2 gap-6">
        <div>
          <p class="text-[20px] text-[#888888]">Pearson r (with N-1 correction)</p>
          <p class="text-[64px] font-black text-[#00FF94] leading-none mt-2">0.843</p>
        </div>
        <div>
          <p class="text-[20px] text-[#888888]">Spearman ρ (rank-based)</p>
          <p class="text-[64px] font-black text-[#00B4D8] leading-none mt-2">1.000</p>
        </div>
      </div>
      <p class="text-[20px] text-[#aaaaaa] mt-8">With sample SD (N-1), the result lands inside the bound. Naive N gives 1.056 — impossible.</p>
    </div>
  </div>
</body>
</html>
