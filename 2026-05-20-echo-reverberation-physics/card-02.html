<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #001A0D; font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; padding: 80px; display: flex; align-items: center; justify-content: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #00FF94; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 96px; font-weight: 900; color: #00FF94; line-height: 0.9; letter-spacing: -2px; margin-bottom: 36px; }
.quote { font-size: 18px; color: #ccc; line-height: 1.5; border-left: 3px solid #00FF94; padding-left: 24px; margin-bottom: 36px; }
.bullets { display: flex; flex-direction: column; gap: 12px; }
.bullet { display: flex; align-items: center; gap: 14px; font-size: 17px; color: #ddd; }
.bullet-dot { width: 8px; height: 8px; border-radius: 50%; background: #00FF94; flex-shrink: 0; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">The Formula</div>
  <div class="label">Part 02</div>
  <h1 class="title">RT60 = 0.161 × V/A</h1>
  <p class="quote">"Wallace Clement Sabine quantified in 1900 how long sound takes to fade to one-millionth of its energy."</p>
  <div class="bullets">
    <div class="bullet"><div class="bullet-dot"></div>V = room volume (m³)</div>
    <div class="bullet"><div class="bullet-dot"></div>A = surface area × absorption coefficient</div>
    <div class="bullet"><div class="bullet-dot"></div>0.161 = Sabine constant for air at 20°C</div>
    <div class="bullet"><div class="bullet-dot"></div>Cathedral RT60: 5–12 seconds. Living room: ~0.4s.</div>
  </div>
</div>
</body>
</html>
