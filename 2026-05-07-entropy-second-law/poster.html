<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entropy - Second Law of Thermodynamics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <p class="text-[18px] text-[#666666] font-semibold tracking-[0.3em] mb-6">SECOND LAW OF THERMODYNAMICS</p>
    <h1 class="text-[120px] font-black text-white tracking-tight leading-none">S = k ln Ω</h1>
    <p class="text-[56px] font-bold text-[#00FF94] mt-6 tracking-tight">Entropy</p>
    <p class="text-[18px] text-[#666666] mt-10 leading-relaxed">Why time flows in one direction</p>
    <div class="mt-12">
      <p class="text-[14px] text-[#444444]">Boltzmann constant</p>
      <p class="text-[24px] font-semibold text-white mt-1">k = 1.38 × 10⁻²³ J/K</p>
    </div>
  </div>
</body>
</html>
