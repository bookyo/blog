<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnot Cycle Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <h1 class="text-[120px] font-black text-white tracking-tight leading-none">η = 1 - T₂/T₁</h1>
    <p class="text-[56px] font-bold text-[#FF6B35] mt-6 tracking-tight">The Carnot Efficiency</p>
    <p class="text-[20px] text-[#666666] mt-10 leading-relaxed">The heat engine limit no device can exceed</p>
    <div class="mt-16 flex justify-center gap-8">
      <div class="text-center">
        <div class="text-[64px] font-black text-white">40%</div>
        <div class="text-[14px] text-[#666666] tracking-widest uppercase mt-2">Max at 500K/300K</div>
      </div>
      <div class="w-px bg-[#333333]"></div>
      <div class="text-center">
        <div class="text-[64px] font-black text-white">1824</div>
        <div class="text-[14px] text-[#666666] tracking-widest uppercase mt-2">Sadi Carnot</div>
      </div>
    </div>
  </div>
</body>
</html>
