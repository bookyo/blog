<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width:1080px; min-height:900px; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
<div class="w-[1080px] px-[80px] py-20">
<p class="text-[24px] font-medium text-[#00FF94] tracking-[0.3em] mb-6">BYTE SAVINGS</p>
<h2 class="text-[80px] font-black text-white tracking-tight leading-none">270<span class="text-[60px] text-[#666]">KB</span> <span class="text-[#00FF94]">→</span>195<span class="text-[60px] text-[#666]">KB</span></h2>
<p class="text-[32px] font-semibold text-white mt-6">Bulma CSS, before and after level-2 minification</p>
<div class="mt-12 border-t border-[#222] pt-8 space-y-4">
<div class="flex justify-between text-[28px] text-white"><span class="mono">270 KB</span><span class="text-[#666]">uncompressed</span></div>
<div class="flex justify-between text-[28px] text-[#00FF94]"><span class="mono">195 KB</span><span>level2 minified</span></div>
<div class="flex justify-between text-[24px] text-[#666]"><span class="mono">75 KB</span><span>saved (28%)</span></div>
</div>
<p class="text-[20px] text-[#666] mt-12 leading-relaxed">Every byte removed is one the browser does not have to parse before first paint.</p>
</div>
</body>
</html>
