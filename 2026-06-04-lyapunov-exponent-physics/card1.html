<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[20px] text-[#00B4D8] tracking-[0.3em] mb-6">CARD 01 · SIGN</p>
    <h2 class="text-[88px] font-black text-white leading-none tracking-tight">Three Regimes</h2>
    <p class="text-[28px] text-[#aaa] mt-10 leading-relaxed">The sign of &lambda; is everything.</p>
    <div class="mt-12 space-y-6">
      <div class="flex items-baseline gap-6">
        <span class="text-[64px] font-black text-[#00FF94]">&lambda; &lt; 0</span>
        <span class="text-[24px] text-[#ccc]">Trajectories converge. System is stable.</span>
      </div>
      <div class="flex items-baseline gap-6">
        <span class="text-[64px] font-black text-[#FFB800]">&lambda; = 0</span>
        <span class="text-[24px] text-[#ccc]">Neutral. Margins neither grow nor shrink.</span>
      </div>
      <div class="flex items-baseline gap-6">
        <span class="text-[64px] font-black text-[#FF6B35]">&lambda; &gt; 0</span>
        <span class="text-[24px] text-[#ccc]">Trajectories diverge. Chaos.</span>
      </div>
    </div>
  </div>
</body>
</html>
