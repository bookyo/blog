<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[#00B4D8] text-[28px] font-bold tracking-widest mb-6">METHOD 2</p>
    <h2 class="text-[88px] font-black text-white leading-none tracking-tight">IQR</h2>
    <p class="text-[36px] text-[#cccccc] mt-8 leading-snug">Interquartile Range uses the middle 50% of data. A point is flagged if it sits more than 1.5 &times; IQR past the third or first quartile.</p>
    <div class="mt-10 border-t border-[#333333] pt-6">
      <p class="text-[24px] text-[#888888] font-mono">x &gt; Q3 + 1.5&middot;IQR &nbsp;or&nbsp; x &lt; Q1 - 1.5&middot;IQR</p>
    </div>
  </div>
</body>
</html>
