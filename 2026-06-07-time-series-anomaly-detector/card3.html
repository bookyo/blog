<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[#FF6B35] text-[28px] font-bold tracking-widest mb-6">WHY STATISTICAL WINS</p>
    <h2 class="text-[88px] font-black text-white leading-none tracking-tight">Static Thresholds Lie</h2>
    <p class="text-[36px] text-[#cccccc] mt-8 leading-snug">A fixed 500 ms alert doesn't know that yesterday's average was 180 ms. The Z-Score does. It adapts to the metric's natural range, scales with its volatility, and stays useful as the system evolves.</p>
