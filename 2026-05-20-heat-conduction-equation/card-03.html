<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #001A0D; font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; padding: 80px; display: flex; align-items: center; justify-content: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #00FF94; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 72px; font-weight: 900; color: #00FF94; line-height: 0.95; letter-spacing: -1px; margin-bottom: 36px; }
.bullets { display: flex; flex-direction: column; gap: 18px; }
.bullet { display: flex; align-items: center; gap: 16px; font-size: 18px; color: #ddd; }
.bullet-dot { width: 8px; height: 8px; border-radius: 50%; background: #00FF94; flex-shrink: 0; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">Real World Applications</div>
  <div class="label">Part 03</div>
  <h1 class="title">Where the Heat Equation Shows Up</h1>
  <div class="bullets">
    <div class="bullet"><div class="bullet-dot"></div>Microelectronics cooling — chip thermal management</div>
    <div class="bullet"><div class="bullet-dot"></div>Climate modeling — ocean heat diffusion</div>
    <div class="bullet"><div class="bullet-dot"></div>Forest fire spread — ignition probability maps</div>
    <div class="bullet"><div class="bullet-dot"></div>Metal forging — uniform heating predictions</div>
  </div>
</div>
</body>
</html>
