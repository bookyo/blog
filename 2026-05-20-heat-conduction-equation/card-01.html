<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0D0D0D; font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; padding: 80px; display: flex; align-items: center; justify-content: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #FF6B35; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 72px; font-weight: 900; color: #FF6B35; line-height: 0.95; letter-spacing: -1px; margin-bottom: 36px; }
.equation { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 700; color: #fff; margin-bottom: 36px; }
.dek { font-size: 20px; color: #aaa; line-height: 1.6; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">The Core Equation</div>
  <div class="label">Part 01</div>
  <div class="equation">∂T/∂t = α∇²T</div>
  <p class="dek">The rate of temperature change equals thermal diffusivity times the curvature of the temperature field. Temperature spreads from hot regions to cold — and the steeper the curve, the faster the flow.</p>
</div>
</body>
</html>
