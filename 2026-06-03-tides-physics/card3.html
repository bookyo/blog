<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="bg-[#0a0008] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20 text-center">

    <div class="mt-10 flex justify-center gap-16">
      <div class="text-center">

      </div>
      <div class="text-center">
        <div class="text-[#666666] text-[16px] font-light uppercase tracking-wider">Reality</div>
        <div class="text-[#FF6B35] text-[36px] font-black mt-2">16.3 m</div>
        <div class="text-[#666666] text-[14px] mt-2">Bay of Fundy</div>
      </div>
    </div>
    <p class="text-[#444444] text-[18px] mt-10 leading-relaxed">Same moon. Different coastline geometry. Friction and resonance do the rest.</p>
