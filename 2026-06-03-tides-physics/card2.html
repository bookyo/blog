<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; background: #001a1a; }
</style>
</head>
<body class="bg-[#001a1a] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20 text-center">
    <p class="text-[#00B4D8] text-[14px] font-semibold tracking-[0.3em] uppercase mb-6">Section 2</p>
    <h2 class="text-[64px] font-bold text-white leading-tight">Spring Tides vs. Neap Tides — Geometry in Action</h2>
    <div class="mt-10 flex justify-center gap-12">
      <div class="text-center">
        <div class="text-[#00FF94] text-[36px] font-black">SPRING</div>
        <div class="text-white text-[18px] mt-3">Sun + Moon aligned<br/>→ Forces ADD<br/>→ Highest tides</div>
      </div>
      <div class="text-center">
        <div class="text-[#FF6B35] text-[36px] font-black">NEAP</div>
        <div class="text-white text-[18px] mt-3">Sun at 90° to Moon<br/>→ Forces partially cancel<br/>→ Lowest tides</div>
      </div>
    </div>
    <p class="text-[#555555] text-[16px] mt-10">Bay of Fundy: up to 16.3 m range during perigean spring tide</p>
  </div>
</body>
</html>
