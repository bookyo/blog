<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; background: #000; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20 text-center">
    <p class="text-[#00B4D8] text-[14px] font-semibold tracking-[0.3em] uppercase mb-6">Section 1</p>
    <h2 class="text-[64px] font-bold text-white leading-tight">The Moon Is 384,400 km Away — And Still Moves the Ocean</h2>
    <div class="mt-10 flex justify-center gap-8">
      <div class="text-center">
        <div class="text-[#00B4D8] text-[48px] font-black">3.4%</div>
        <div class="text-[#666666] text-[16px] mt-2">Gravity differential<br/>across Earth's diameter</div>
      </div>
      <div class="text-center">
        <div class="text-[#00B4D8] text-[48px] font-black">2 bulges</div>
        <div class="text-[#666666] text-[16px] mt-2">One faces the moon,<br/>one directly opposite</div>
      </div>
    </div>
    <p class="text-[#444444] text-[18px] mt-10 leading-relaxed">The tidal force scales with the RATE OF CHANGE of gravity — not with gravity itself.</p>
  </div>
</body>
</html>
