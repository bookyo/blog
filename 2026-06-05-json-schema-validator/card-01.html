<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1280px; min-height: 720px; background: #000; margin: 0; }
.code { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
<div class="w-[1280px] h-[720px] flex flex-col justify-center px-[100px] py-16">
  <p class="text-[20px] font-bold text-[#FF6B35] tracking-[0.3em] uppercase mb-6">2 A.M. PAGE</p>
  <h2 class="text-[68px] font-black text-white leading-[1.05] mb-8">A string slipped<br/>into a number field.</h2>
  <div class="code bg-[#0a0a0a] border-l-4 border-[#FF6B35] p-5 text-[22px] mb-6 max-w-[820px]">
    <p><span class="text-[#666]">//</span> <span class="text-[#888]">the request that broke production</span></p>
    <p class="mt-1">{ <span class="text-[#00FF94]">"price"</span>: <span class="text-[#FF6B35]">"$49.99"</span> }</p>
    <p class="mt-1 text-[#666]">// schema: type: number</p>
  </div>
  <p class="text-[22px] text-[#aaa] leading-relaxed max-w-[820px]">One missing check. One cascading webhook. One CEO dashboard full of red at 8 a.m.</p>
</div>
</body>
</html>
