<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; background: #000; margin: 0; }
.code { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
<div class="w-[1080px] text-center px-[100px] py-24">
  <p class="text-[24px] font-semibold text-[#00B4D8] tracking-[0.3em] uppercase mb-8">Why Every Modern API</p>
  <h1 class="text-[120px] font-black text-white tracking-tight leading-[0.95]">Hides a<br/>Tiny Contract</h1>
  <p class="text-[42px] font-bold text-[#00B4D8] mt-10 leading-tight">in its JSON</p>
  <div class="code mt-12 mx-auto w-fit bg-[#0a0a0a] border border-[#00B4D8] rounded-lg px-6 py-4 text-left">
    <p class="text-[16px] text-[#666] mb-1">// A 2 a.m. page</p>
    <p class="text-[20px] text-[#FF6B35]">"price": "$49.99"</p>
    <p class="text-[16px] text-[#666] mt-1">// schema asked for: number</p>
  </div>
  <p class="text-[18px] text-[#888] mt-12 leading-relaxed max-w-[800px] mx-auto">JSON Schema is the line between systems that hold up<br/>and systems that fail in production.</p>
</div>
</body>
</html>
