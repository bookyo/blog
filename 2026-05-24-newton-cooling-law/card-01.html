<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000D1A; font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; padding: 80px; display: flex; align-items: center; justify-content: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #00B4D8; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 72px; font-weight: 900; color: #00B4D8; line-height: 0.95; letter-spacing: -2px; margin-bottom: 36px; }
.quote { font-size: 18px; color: #ccc; line-height: 1.5; border-left: 3px solid #00B4D8; padding-left: 24px; margin-bottom: 36px; }
.bullets { display: flex; flex-direction: column; gap: 12px; }
.bullet { display: flex; align-items: center; gap: 14px; font-size: 17px; color: #ddd; }
.bullet-dot { width: 8px; height: 8px; border-radius: 50%; background: #00B4D8; flex-shrink: 0; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">Core Principle</div>
  <div class="label">Part 01</div>
  <h1 class="title">T(t) = T_env + (T₀ - T_env) × e^(-kt)</h1>
  <p class="quote">"Cooling is exponential, not linear."</p>
  <div class="bullets">
    <div class="bullet"><div class="bullet-dot"></div>e^(-kt) is the exponential decay factor</div>
    <div class="bullet"><div class="bullet-dot"></div>k is the cooling constant — material and geometry dependent</div>
    <div class="bullet"><div class="bullet-dot"></div>The bigger the temperature gap, the faster the cooling</div>
  </div>
</div>
</body>
</html>
