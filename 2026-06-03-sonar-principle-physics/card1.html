<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[100px] py-20" style="background:#0a1628;">
    <div style="border-left: 6px solid #00FF94; padding-left: 40px;">
      <p class="text-[100px] font-black text-white leading-none">1,500 m/s</p>
      <p class="text-[32px] font-bold mt-4 tracking-tight" style="color:#00FF94;">The speed of sound in seawater</p>
      <p class="text-[20px] text-[#AAAAAA] mt-8 leading-relaxed">Not a constant — varies with temperature, salinity, and depth. But 1,500 m/s is the reference point every sonar system uses as a baseline.</p>
    </div>
  </div>
</body>
