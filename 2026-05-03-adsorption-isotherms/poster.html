<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adsorption Isotherms Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Outfit', sans-serif; }
  .mono { font-family: 'Courier New', monospace; }
</style>
</head>
<body class="bg-[#000D1A] flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <!-- Core focus: surface area number -->
    <p class="text-[18px] text-[#00B4D8] font-semibold tracking-widest uppercase mb-4">BET Surface Area</p>
    <h1 class="text-[160px] font-black text-white tracking-tight leading-none">1500</h1>
    <p class="text-[48px] font-bold text-[#00B4D8] mt-2 tracking-tight">m²/g</p>
    <!-- Secondary: isotherm formula -->
    <div class="mt-10 bg-[#001a33] rounded-2xl py-8 px-10 inline-block">
      <p class="text-[24px] text-white font-mono tracking-wide">q = q<sub class="text-[#00B4D8]">max</sub> × (K<sub>L</sub> × C) / (1 + K<sub>L</sub> × C)</p>
    </div>
    <!-- Description -->
    <p class="text-[18px] text-[#4a7a8a] mt-10 leading-relaxed">
      How molecules stick to surfaces —<br>
      the equation that decides whether carbon capture works
    </p>
  </div>
</body>
</html>
