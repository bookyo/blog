<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <div style="border-top: 3px solid #FF6B35;" class="pt-8">
      <h2 class="text-[56px] font-extrabold text-white leading-tight">Field Lines Tell the Story</h2>
      <p class="text-[22px] text-[#aaaaaa] mt-6 leading-relaxed">Toggle "Show Field Lines" in the simulation and you see the pattern: lines emerge from positives, converge on negatives. Density shows strength. This is the visual language of every electric field.</p>
    </div>
    <div class="mt-12 flex items-center gap-3">
      <div class="w-3 h-3 rounded-full" style="background:#FF6B35;"></div>
      <span class="text-[14px] text-[#555555] font-medium tracking-widest uppercase">Coulomb's Law</span>
    </div>
  </div>
</body>
</html>
