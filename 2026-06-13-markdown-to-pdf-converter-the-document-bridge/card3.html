<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  padding: 0;
}
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <div class="text-[#00B4D8] text-[24px] font-bold tracking-widest uppercase mb-8">A4 vs Letter</div>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-none mb-10">17 points.<br/>One column.</h2>
    <p class="text-[26px] text-[#CCCCCC] leading-relaxed mt-8">A four-column table that fits on Letter spills onto page two on A4, because Letter's content area is 512pt wide and A4's is 495pt — a 3.4% width difference, enough to push one column off the page.</p>
  </div>
</body>
</html>
