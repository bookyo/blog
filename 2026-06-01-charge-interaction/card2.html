<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;

<body class="flex items-center justify-center p-12">
  <div class="w-[1080px] flex flex-col items-center text-center">
    <div class="w-full h-[4px] bg-white mb-12" style="background: #00B4D8"></div>
    <h2 class="text-[72px] font-black text-white tracking-tight leading-none">The Inverse-Square</h2>
