<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  background: #1A0E0A;
  color: #FFF8E7;
  display: flex;
  align-items: center;
  justify-content: center;
}
.poster {
  width: 1080px;
  height: 900px;
  padding: 80px 90px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.tag {
  display: inline-block;
  padding: 10px 20px;
  border: 2px solid #FF6B35;
  color: #FF6B35;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 40px;
  align-self: flex-start;
}
h1 {
  font-size: 96px;
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -3px;
  margin: 0 0 30px 0;
  color: #FFF8E7;
}
h1 .accent { color: #FF6B35; }
.subtitle {
  font-size: 32px;
  color: #8B6F5C;
  line-height: 1.4;
  margin-top: 20px;
  font-weight: 400;
  max-width: 850px;
}
.postcodes {
  display: flex;
  gap: 24px;
  margin-top: 60px;
  font-family: 'Courier New', monospace;
  font-size: 28px;
  font-weight: 700;
}
.pc {
  padding: 16px 24px;
  border: 2px solid #FFD166;
  color: #FFD166;
  letter-spacing: 1px;
}
.footer {
  position: absolute;
  bottom: 60px;
  right: 90px;
  font-size: 18px;
  color: #8B6F5C;
  font-weight: 600;
  letter-spacing: 2px;
}
</style>
</head>
<body>
  <div class="poster">
    <div class="tag">Global Postal Codes</div>
    <h1>Every Five-Digit<br/>Number Is a <span class="accent">Local Secret</span></h1>
    <p class="subtitle">90210. SW1A 1AA. 100-0001. Three postcodes, three countries, three completely different rules — and that is the easy part.</p>
    <div class="postcodes">
      <div class="pc">90210</div>
      <div class="pc">SW1A 1AA</div>
      <div class="pc">100-0001</div>
    </div>
  </div>
  <div class="footer">ELYSIATOOLS.COM</div>
</body>
</html>
