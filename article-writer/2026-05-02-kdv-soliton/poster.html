<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Poster</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <div class="w-[1080px] text-center px-[108px] py-24">
    <!-- Core focus: giant number/formula -->
    <h1 class="text-[120px] font-black text-white tracking-tight leading-none">SOLITON</h1>
    <!-- Secondary: subtitle in accent -->
    <p class="text-[36px] font-bold text-[#00FF94] mt-6 tracking-tight">The Wave That Survives Every Collision</p>
    <!-- Description -->
    <p class="text-[18px] text-[#666666] mt-10 leading-relaxed">When two solitons collide, they pass through each other unchanged — a mathematical miracle that powers fiber optics, travels as tsunami, and proves order can emerge from chaos.</p>
    <!-- Tool name -->
    <p class="text-[14px] text-[#888888] mt-8 tracking-widest uppercase">ElysiaTools · Interactive Visualization</p>
  </div>
</body>
</html>
