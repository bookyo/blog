<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; background: #000; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
<div class="w-[1080px] px-[80px] py-16 text-center">
  <p class="text-[22px] font-semibold text-[#00B4D8] tracking-widest">THE STRUCTURE</p>
  <h2 class="text-[80px] font-black text-white leading-none mt-6">AAA-GG-SSSS</h2>
  <p class="text-[28px] text-[#cccccc] mt-8 leading-relaxed">Three fields, three rule sets.<br/>
  Area &ne; 000, 666, 900&ndash;999 &middot; Group &ne; 00 &middot; Serial &ne; 0000</p>
  <p class="text-[18px] text-[#666] mt-12 font-mono">^(?!000|666|9\d{2})\d{3}-(?!00)\d{2}-(?!0000)\d{4}$</p>
</div>
</body>
</html>
