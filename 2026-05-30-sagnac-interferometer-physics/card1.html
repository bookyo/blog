<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>

<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-16">
    <div class="text-[16px] font-semibold tracking-[0.25em] uppercase mb-6" style="color: #00FF94">Core Principle</div>
    <h2 class="text-[56px] font-bold text-white leading-tight tracking-tight mb-8">Counter-Propagating Beams Arrive at Different Times</h2>
    <div class="w-16 h-[2px]" style="background:#00FF94"></div>
    <p class="text-[22px] text-[#888888] font-light leading-relaxed mt-8">Two light beams traveling opposite directions around a rotating platform take different amounts of time to complete the loop — even though the geometric distance is identical in either direction.</p>
  </div>
