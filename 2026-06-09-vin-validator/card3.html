<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-[22px] font-semibold text-[#FF6B35] tracking-widest uppercase mb-6">Worked example: 2003 Honda Civic</p>
    <h2 class="text-[58px] font-black text-white tracking-tight leading-none mb-8">Sum = 311<br/>311 mod 11 = <span class="text-[#00FF94]">3</span> ✓</h2>
    <div class="bg-[#1a1a1a] rounded-lg p-6 font-mono">
      <p class="text-[20px] text-white">1×H×8 = 8</p>
      <p class="text-[20px] text-white">+ H(8)×7 = 56</p>
      <p class="text-[20px] text-white">+ G(7)×6 = 42</p>
      <p class="text-[20px] text-white">+ C(3)×5 = 15</p>
      <p class="text-[20px] text-white">+ M(4)×4 = 16</p>
      <p class="text-[20px] text-white">+ 8×3, 2×2, 6×10 = 88</p>
      <p class="text-[20px] text-white">+ 3×9, A(1)×8, 0,0,4×5,3×4,5×3,2×2 = 86</p>
      <p class="text-[24px] text-[#00FF94] font-bold mt-3">= 311 → mod 11 → check digit 3 ✓</p>
    </div>
  </div>
</body>
</html>
