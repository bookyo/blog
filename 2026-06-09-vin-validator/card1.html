<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
}
</style>
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-[22px] font-semibold text-[#00FF94] tracking-widest uppercase mb-6">The 17-character layout</p>
    <h2 class="text-[64px] font-black text-white tracking-tight leading-none mb-8">Every VIN has<br/>three sections</h2>
    <div class="space-y-4 mt-8">
      <div class="border-l-4 border-[#00FF94] pl-5">
        <p class="text-[32px] font-bold text-white font-mono">1HGCM82633A004352</p>
        <p class="text-[18px] text-[#999999] mt-1">↑ positions 1–3: World Manufacturer Identifier</p>
      </div>
      <div class="border-l-4 border-[#00FF94] pl-5">
        <p class="text-[32px] font-bold text-white font-mono">1HGCM82633A004352</p>
        <p class="text-[18px] text-[#999999] mt-1">↑ positions 4–9: Vehicle Descriptor Section (pos 9 is the check digit)</p>
      </div>
      <div class="border-l-4 border-[#00FF94] pl-5">
        <p class="text-[32px] font-bold text-white font-mono">1HGCM82633A004352</p>
        <p class="text-[18px] text-[#999999] mt-1">↑ positions 10–17: Vehicle Identifier Section (year, plant, serial)</p>
      </div>
    </div>
  </div>
</body>
</html>
