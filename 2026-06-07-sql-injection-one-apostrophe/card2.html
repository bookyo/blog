<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; background: #0a0a0a; }
</style>
</head>
<body class="flex items-center justify-center p-16">
  <div class="w-[960px]">
    <p class="text-[24px] text-[#FF6B35] font-bold tracking-widest mb-8">THE FIVE FAMILIES</p>
    <p class="text-[64px] font-black text-white leading-tight tracking-tight mb-12">Every SQL injection fits<br/>one of these patterns</p>
    <div class="space-y-4">
      <div class="flex items-start gap-6"><span class="text-[#FF6B35] font-black text-[36px] w-16">01</span><div><p class="text-[28px] text-white font-bold">Tautology</p><p class="font-mono text-[20px] text-[#888]">' OR 1=1--</p></div></div>
      <div class="flex items-start gap-6"><span class="text-[#FF6B35] font-black text-[36px] w-16">02</span><div><p class="text-[28px] text-white font-bold">UNION-based</p><p class="font-mono text-[20px] text-[#888]">' UNION SELECT NULL--</p></div></div>
      <div class="flex items-start gap-6"><span class="text-[#FF6B35] font-black text-[36px] w-16">03</span><div><p class="text-[28px] text-white font-bold">Stacked query</p><p class="font-mono text-[20px] text-[#888]">'; DROP TABLE users--</p></div></div>
      <div class="flex items-start gap-6"><span class="text-[#FF6B35] font-black text-[36px] w-16">04</span><div><p class="text-[28px] text-white font-bold">Time-based blind</p><p class="font-mono text-[20px] text-[#888]">'; WAITFOR DELAY '0:0:5'--</p></div></div>
      <div class="flex items-start gap-6"><span class="text-[#FF6B35] font-black text-[36px] w-16">05</span><div><p class="text-[28px] text-white font-bold">Boolean-based blind</p><p class="font-mono text-[20px] text-[#888]">' AND 1=1--</p></div></div>
    </div>
  </div>
</body>
</html>
