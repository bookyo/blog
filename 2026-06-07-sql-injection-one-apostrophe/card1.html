<body class="flex items-center justify-center p-16">
  <div class="w-[960px]">
    <p class="text-[24px] text-[#FF6B35] font-bold tracking-widest mb-8">THE 11-CHARACTER PAYLOAD</p>
    <p class="text-[80px] font-black text-white leading-none tracking-tight">FROM LOGIN FORM</p>
    <p class="text-[80px] font-black text-[#FF6B35] leading-none tracking-tight mt-4">TO FULL TABLE DUMP</p>
