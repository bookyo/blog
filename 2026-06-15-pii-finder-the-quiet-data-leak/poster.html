<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      width: 1080px;
      min-height: 900px;
      background: linear-gradient(135deg, #0f0a1a 0%, #1a0a2e 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .poster {
      text-align: center;
      max-width: 900px;
      padding: 60px;
    }
    .eyebrow {
      font-size: 14px;
      letter-spacing: 4px;
      color: #a855f7;
      margin-bottom: 24px;
      font-weight: 600;
    }
    .title {
      font-size: 72px;
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 24px;
      color: #c0c0e0;
      font-weight: 300;
      line-height: 1.4;
      max-width: 700px;
      margin: 0 auto;
    }
    .accent-bar {
      width: 120px;
      height: 4px;
      background: #a855f7;
      margin: 32px auto 0;
    }
  </style>
</head>
<body>
  <div class="poster">
    <div class="eyebrow">PRIVACY · GDPR · COMPLIANCE</div>
    <h1 class="title">The Five Lines of PII Quietly Sitting in Your Logs</h1>
    <p class="subtitle">A PII scanner is the floor, not the ceiling — and most of your leaks are coming from console.log.</p>
    <div class="accent-bar"></div>
  </div>
</body>
</html>
