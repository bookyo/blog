<!DOCTYPE html>
<html><head><meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }</style>
</head><body class="bg-[#0A0A0A] flex items-center justify-center p-12">
<div class="w-full">
  <p class="text-[#00FF94] text-[28px] font-bold tracking-widest">SIGNATURE</p>
  <p class="text-white text-[200px] font-black leading-none mt-4">HMAC</p>
  <p class="text-[#00B4D8] text-[60px] font-mono mt-4 leading-tight">SHA256(</p>
  <p class="text-white text-[32px] font-mono ml-12 mt-2 leading-tight">header.payload,</p>
  <p class="text-[#FF6B35] text-[32px] font-mono ml-12 mt-2 leading-tight">secret</p>
  <p class="text-[#00B4D8] text-[60px] font-mono mt-2 leading-tight">)</p>
  <p class="text-[#888] text-[28px] mt-12 leading-relaxed">Same secret = same signature. Different secret = chaos.</p>
</div>
</body></html>
