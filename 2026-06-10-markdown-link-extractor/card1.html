<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  background: #0a0a0a;
}
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-[#FF6B35] text-[24px] font-bold tracking-widest uppercase">CARD 1 / 3</p>
    <h2 class="text-[80px] font-black text-white leading-none mt-6">Five link</h2>
    <h2 class="text-[80px] font-black text-[#FF6B35] leading-none">syntaxes</h2>
    <div class="mt-12 space-y-5">
      <p class="text-[28px] text-white"><span class="text-[#FF6B35] font-bold">Inline</span>  <code class="text-[#00FF94]">[text](url)</code></p>
      <p class="text-[28px] text-white"><span class="text-[#FF6B35] font-bold">Reference</span>  <code class="text-[#00FF94]">[text][ref]</code> / <code class="text-[#00FF94]">[ref][]</code></p>
      <p class="text-[28px] text-white"><span class="text-[#FF6B35] font-bold">Image</span>  <code class="text-[#00FF94]">![alt](url)</code></p>
      <p class="text-[28px] text-white"><span class="text-[#FF6B35] font-bold">Autolink</span>  <code class="text-[#00FF94]">&lt;https://...&gt;</code></p>
      <p class="text-[28px] text-white"><span class="text-[#FF6B35] font-bold">Bare</span>  <code class="text-[#00FF94]">https://...</code></p>
    </div>
  </div>
</body>
</html>
