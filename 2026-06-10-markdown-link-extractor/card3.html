<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Outfit', sans-serif;
  width: 1080px;
  min-height: 900px;
  margin: 0;
  background: #0a0a0a;
}
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] px-16 py-20">
    <p class="text-[#FF6B35] text-[24px] font-bold tracking-widest uppercase">CARD 3 / 3</p>
    <h2 class="text-[78px] font-black text-white leading-none mt-6">Three</h2>
    <h2 class="text-[78px] font-black text-[#FF6B35] leading-none">checkpoints</h2>
    <div class="mt-10 space-y-7 text-[30px]">
      <p class="text-white"><span class="text-[#FF6B35] font-bold text-[44px]">1.</span> After the first complete draft</p>
      <p class="text-white"><span class="text-[#FF6B35] font-bold text-[44px]">2.</span> After the final structural edit</p>
      <p class="text-white"><span class="text-[#FF6B35] font-bold text-[44px]">3.</span> Just before publication</p>
    </div>
    <p class="text-[#999999] text-[22px] mt-12 leading-relaxed">Each pass catches what the previous one did not.</p>
  </div>
</body>
</html>
