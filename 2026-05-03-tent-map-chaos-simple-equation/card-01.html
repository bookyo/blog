<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Outfit', sans-serif; background: #001A0D; }
  .accent { color: #00FF94; }
  .bg-accent { background-color: #00FF94; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-12">
  <div class="w-[1080px]">
    <p class="text-[14px] tracking-[0.35em] uppercase mb-6" style="color: #00CC77;">The Core Equation</p>
    <h2 class="text-[72px] font-black text-white leading-[0.95] tracking-tight mb-8">One Line. Two Variables. Infinite Surprises.</h2>
    <p class="text-[26px] text-[#AAAAAA] leading-relaxed mb-8 max-w-[900px]">The tent map equation x_{n+1} = r · min(x_n, 1 − x_n) contains the entire route to chaos — and it solves exactly.</p>
    <blockquote class="border-l-4 pl-6 py-2" style="border-color: #00FF94;">
      <p class="text-[22px] text-[#888888] italic leading-relaxed">"When the math has no curves to hide behind, the path from order to chaos becomes impossible to miss."</p>
    </blockquote>
  </div>
</body>
</html>
