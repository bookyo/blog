<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Outfit', sans-serif; background: #0D0D0D; }
  .accent { color: #FF6B35; }
  .bg-accent { background-color: #FF6B35; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-12">
  <div class="w-[1080px]">
    <p class="text-[14px] tracking-[0.35em] uppercase mb-6" style="color: #CC5529;">The Exact Measure</p>
    <h2 class="text-[72px] font-black text-white leading-[0.95] tracking-tight mb-8">λ = ln(r)</h2>
    <p class="text-[26px] text-[#AAAAAA] leading-relaxed mb-8 max-w-[900px]">The tent map's Lyapunov exponent has an exact analytical formula — no approximation, no simulation. For r < 1: order. For r > 1: chaos. The sign of λ tells all.</p>
    <blockquote class="border-l-4 pl-6 py-2" style="border-color: #FF6B35;">
      <p class="text-[22px] text-[#888888] italic leading-relaxed">"At r = 2, λ = ln(2) ≈ 0.693. Every iteration doubles the separation between nearby trajectories."</p>
    </blockquote>
  </div>
</body>
</html>
