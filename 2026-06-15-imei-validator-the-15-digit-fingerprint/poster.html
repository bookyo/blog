<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    width: 1080px;
    min-height: 900px;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2a1f4a 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0, 212, 255, 0.12) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.10) 0%, transparent 40%);
    z-index: 0;
  }
  .container { position: relative; z-index: 1; text-align: center; max-width: 900px; }
  .eyebrow {
    font-size: 18px; letter-spacing: 6px; font-weight: 600;
    color: #00d4ff; margin-bottom: 32px; text-transform: uppercase;
  }
  .title {
    font-size: 72px; font-weight: 800; line-height: 1.05; margin-bottom: 28px;
    color: #ffffff;
  }
  .subtitle {
    font-size: 26px; color: #c8d0e0; font-weight: 300; line-height: 1.4;
    margin-bottom: 32px;
  }
  .divider {
    width: 80px; height: 4px; background: #00d4ff; margin: 0 auto 32px;
  }
  .meta {
    font-size: 16px; letter-spacing: 3px; color: #6a7a90; text-transform: uppercase;
  }
  .digits {
    font-size: 36px; font-weight: 300; color: #00d4ff; margin-top: 28px;
    font-family: 'Courier New', monospace; letter-spacing: 6px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">Mobile Forensics</div>
    <h1 class="title">The 15-Digit Fingerprint Your Phone Carries Even When It Is Off</h1>
    <p class="subtitle">Every device, every network, every tower &mdash; the IMEI structure that quietly identifies a phone since before you owned it.</p>
    <div class="divider"></div>
    <div class="digits">490154203237518</div>
    <div class="meta" style="margin-top: 24px;">Elysia Tools &middot; IMEI Validator</div>
  </div>
</body>
</html>
