    <h2 class="text-[64px] font-black text-white leading-tight mb-6">The Plasma Frequency Cutoff</h2>
    <p class="text-[22px] text-[#94a3b8] leading-relaxed">n² = 1 − ωp²/ω²</p>
    <p class="text-[18px] text-[#64748b] mt-6 leading-relaxed">When wave frequency drops below the plasma frequency, the refractive index becomes imaginary. The wave cannot propagate — it reflects. This is why low-frequency radio signals never reach the ionosphere.</p>
