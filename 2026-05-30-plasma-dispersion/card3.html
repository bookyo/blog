    <h2 class="text-[64px] font-black text-white leading-tight mb-6">Phase vs Group Velocity</h2>
    <p class="text-[22px] text-[#94a3b8] leading-relaxed">vφ = ω/k &nbsp;&nbsp; vg = dω/dk</p>
    <p class="text-[18px] text-[#64748b] mt-6 leading-relaxed">In plasma, phase velocity and group velocity diverge. A wave packet disperses — different frequency components travel at different speeds. This is how radio pulses spread over thousands of kilometers through the ionosphere.</p>
