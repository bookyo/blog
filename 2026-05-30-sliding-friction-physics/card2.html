<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }
</style>
</head>
<body class="bg-[#1a0a0a] flex items-center justify-center">
  <div class="w-[1080px] text-center px-[80px] py-20">
    <p class="text-[22px] text-[#FF6B35] font-semibold tracking-widest uppercase mb-6">Card 2 / 3</p>
    <h2 class="text-[72px] font-black text-white leading-tight mb-8">The 40% Drop</h2>
    <div class="bg-[#2a1510] rounded-3xl p-10 mb-8">
      <p class="text-[48px] font-bold text-white mb-4">5 kg block on concrete</p>
      <div class="grid grid-cols-2 gap-8 mt-6">
        <div class="bg-[#1a0a0a] rounded-xl p-6">
          <p class="text-[20px] text-[#94a3b8] mb-2">Max Static</p>
          <p class="text-[56px] font-black text-[#FF6B35]">24.5 N</p>
          <p class="text-[18px] text-[#64748b] mt-2">μ<sub>s</sub>=0.50 × 49N</p>
        </div>
        <div class="bg-[#1a0a0a] rounded-xl p-6">
          <p class="text-[20px] text-[#94a3b8] mb-2">Kinetic</p>
          <p class="text-[56px] font-black text-[#FF8C5A]">14.7 N</p>
          <p class="text-[18px] text-[#64748b] mt-2">μ<sub>k</sub>=0.30 × 49N</p>
        </div>
      </div>
    </div>
    <p class="text-[20px] text-[#94a3b8] leading-relaxed">The transition from static to kinetic reduces resisting force by ~40% — which is why the first push always feels harder than the push that follows.</p>
  </div>
</body>
</html>
