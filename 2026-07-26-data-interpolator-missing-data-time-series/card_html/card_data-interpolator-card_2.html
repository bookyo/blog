<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Outfit',sans-serif;
  width:1280px; min-height:900px;
  background:#1a0a0a;
  color:#ffe0d0;
  padding:60px 60px 50px 60px;
  display:flex; flex-direction:column;
}
.top-accent{height:5px;background:#ff6b35;margin:-60px -60px 30px -60px;}
.eyebrow{font-size:16px;letter-spacing:3px;color:#ff6b35;font-weight:600;margin-bottom:10px;}
.title{font-size:44px;font-weight:800;line-height:1.1;margin-bottom:14px;}
.dek{font-size:19px;color:#ffe0d0;opacity:0.78;margin-bottom:36px;line-height:1.4;max-width:1100px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;flex:1;}
.col{
  border:2px solid #ff6b35;
  padding:32px 28px;
  display:flex; flex-direction:column;
  background:#1a0a0a;
}
.col-label{font-size:14px;letter-spacing:3px;font-weight:700;margin-bottom:24px;}
.col-body{font-size:22px;font-weight:500;line-height:1.4;}
</style></head>
<body>
<div class="top-accent"></div>
<div class="eyebrow">HIGHLIGHT &middot; METHOD CHOICE</div>
<h2 class="title">Match the fill to the signal</h2>
<p class="dek">Different methods encode different stories about how a series changes.</p>
<div class="grid">
<div class="col" style="border-color:#ff6b35"><div class="col-label" style="color:#ff6b35">1. METHOD</div><div class="col-body">Linear bridges short gaps</div></div><div class="col" style="border-color:#ff6b35"><div class="col-label" style="color:#ff6b35">2. METHOD</div><div class="col-body">Forward fill carries state</div></div><div class="col" style="border-color:#ff6b35"><div class="col-label" style="color:#ff6b35">3. METHOD</div><div class="col-body">Nearest copies proximity</div></div>
</div>
</body></html>
