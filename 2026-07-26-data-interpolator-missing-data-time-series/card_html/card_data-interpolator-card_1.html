<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Outfit',sans-serif;
  width:1280px; min-height:900px;
  background:#0a1628;
  color:#e0f4ff;
  padding:60px 60px 50px 60px;
  display:flex; flex-direction:column;
}
.top-accent{height:5px;background:#00d4ff;margin:-60px -60px 30px -60px;}
.eyebrow{font-size:16px;letter-spacing:3px;color:#00d4ff;font-weight:600;margin-bottom:10px;}
.title{font-size:44px;font-weight:800;line-height:1.1;margin-bottom:14px;}
.dek{font-size:19px;color:#e0f4ff;opacity:0.78;margin-bottom:36px;line-height:1.4;max-width:1100px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;flex:1;}
.col{
  border:2px solid #00d4ff;
  padding:32px 28px;
  display:flex; flex-direction:column;
  background:#0a1628;
}
.col-label{font-size:14px;letter-spacing:3px;font-weight:700;margin-bottom:24px;}
.col-body{font-size:22px;font-weight:500;line-height:1.4;}
</style></head>
<body>
<div class="top-accent"></div>
<div class="eyebrow">HIGHLIGHT &middot; CORE IDEA</div>
<h2 class="title">A blank cell is evidence</h2>
<p class="dek">Missingness describes collection failure before it describes a value.</p>
<div class="grid">
<div class="col" style="border-color:#00d4ff"><div class="col-label" style="color:#00d4ff">1. RULE</div><div class="col-body">Detect gaps before filling</div></div><div class="col" style="border-color:#00d4ff"><div class="col-label" style="color:#00d4ff">2. RULE</div><div class="col-body">Separate unknown from zero</div></div><div class="col" style="border-color:#00d4ff"><div class="col-label" style="color:#00d4ff">3. RULE</div><div class="col-body">Review the report first</div></div>
</div>
</body></html>
