<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[24px] text-[#00B4D8] font-semibold tracking-widest">PREFIX LOCALITY</p>
    <h2 class="text-[80px] font-black text-white mt-4 leading-tight">Typo in geohash: recoverable.<br/>Typo in coordinate: not.</h2>
    <p class="text-[26px] text-[#999999] mt-6 leading-relaxed">Change one character in 39.9042 and you are 4 km away. Change one character in wx4g8s9z3kp7 and you are in the same building, just the wrong entrance.</p>
    <p class="text-[28px] text-[#00B4D8] font-bold mt-8">Hierarchical cells: errors stay local.</p>
  </div>
</body>
</html>
