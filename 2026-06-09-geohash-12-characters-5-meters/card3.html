<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[24px] text-[#FF6B35] font-semibold tracking-widest">PRECISION TABLE</p>
    <h2 class="text-[80px] font-black text-white mt-4 leading-tight">Pick the right depth for the question</h2>
    <p class="text-[24px] text-white mt-6 leading-relaxed"><span class="text-[#FF6B35] font-bold">1 char</span>  ~5000 km (continent)  <span class="text-[#FF6B35] font-bold ml-6">5 char</span>  ~5 km (city)</p>
    <p class="text-[24px] text-white mt-3 leading-relaxed"><span class="text-[#FF6B35] font-bold">3 char</span>  ~156 km (country)  <span class="text-[#FF6B35] font-bold ml-6">7 char</span>  ~150 m (neighbourhood)</p>
    <p class="text-[24px] text-white mt-3 leading-relaxed"><span class="text-[#FF6B35] font-bold">9 char</span>  ~4.7 m (building)  <span class="text-[#FF6B35] font-bold ml-6">12 char</span>  ~3.7 cm (parking spot)</p>
  </div>
</body>
</html>
