<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; }</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[24px] text-[#00FF94] font-semibold tracking-widest">THE 32-CHARACTER ALPHABET</p>
    <h2 class="text-[80px] font-black text-white mt-4 leading-tight">Nobody designed it by accident</h2>
    <p class="text-[26px] text-[#999999] mt-6 leading-relaxed">No a, i, l, o. The 2008 alphabet drops letters that look like digits, because the cost of a mistyped location is paid in gasoline, not keystrokes.</p>
    <p class="text-[28px] text-[#00FF94] font-bold mt-8">wx4g8s9z3kp7  →  60 bits of position</p>
  </div>
</body>
</html>
