<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[24px] text-[#FF6B35] tracking-[0.2em] font-bold uppercase">03 · ATTACKS</p>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-none mt-6">The three<br/>ways tokens lie</h2>
    <div class="mt-10 space-y-5">
      <div class="bg-[#111111] border-l-4 border-[#FF6B35] p-5 rounded">
        <p class="mono text-[24px] text-[#FF6B35]">alg: none</p>
        <p class="text-[20px] text-[#888888] mt-2">verifier reads the header and accepts a token with no signature.</p>
      </div>
      <div class="bg-[#111111] border-l-4 border-[#FF6B35] p-5 rounded">
        <p class="mono text-[24px] text-[#FF6B35]">HS256 / RS256 confusion</p>
        <p class="text-[20px] text-[#888888] mt-2">attacker signs HS256 with the public key as the secret.</p>
      </div>
      <div class="bg-[#111111] border-l-4 border-[#FF6B35] p-5 rounded">
        <p class="mono text-[24px] text-[#FF6B35]">missing exp</p>
        <p class="text-[20px] text-[#888888] mt-2">a token without expiration is a permanent skeleton key.</p>
      </div>
    </div>
  </div>
</body>
</html>
