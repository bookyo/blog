<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; margin: 0; }
.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body class="bg-black flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[24px] text-[#00FF94] tracking-[0.2em] font-bold uppercase">01 · STRUCTURE</p>
    <h2 class="text-[80px] font-black text-white tracking-tight leading-none mt-6">Three sections,<br/>two dots apart</h2>
    <p class="text-[26px] text-[#cccccc] mt-10 leading-relaxed">A JWT is base64url-encoded JSON joined by periods:</p>
    <div class="mt-10 bg-[#111111] border-l-4 border-[#00FF94] p-8 rounded">
      <p class="mono text-[32px] text-[#00FF94]">eyJhbGciOi...<br/>.<br/>eyJzdWIiOi...<br/>.<br/>dBjftJeZ4CVP...</p>
    </div>
    <p class="text-[22px] text-[#888888] mt-10 leading-relaxed"><strong class="text-white">header.payload.signature</strong> &mdash; the recipe, the ingredients, the seal.</p>
  </div>
</body>
</html>
