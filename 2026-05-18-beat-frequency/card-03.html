<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1A0D0D; font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; padding: 80px; display: flex; align-items: center; justify-content: center; }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #FF6B35; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #555; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
.title { font-size: 96px; font-weight: 900; color: #FF6B35; line-height: 0.9; letter-spacing: -2px; margin-bottom: 36px; }
.quote { font-size: 18px; color: #ccc; line-height: 1.5; border-left: 3px solid #FF6B35; padding-left: 24px; margin-bottom: 36px; }
.bullets { display: flex; flex-direction: column; gap: 12px; }
.bullet { display: flex; align-items: center; gap: 14px; font-size: 17px; color: #ddd; }
.bullet-dot { width: 8px; height: 8px; border-radius: 50%; background: #FF6B35; flex-shrink: 0; }
</style>
</head>
<body>
<div>
  <div class="eyebrow">The Trigonometric Origin</div>
  <div class="label">Part 03</div>
  <h1 class="title">Superposition</h1>
  <p class="quote">"Two cosines sum to a product — a fast carrier multiplied by a slow envelope."</p>
  <div class="bullets">
    <div class="bullet"><div class="bullet-dot"></div>cos(f1) + cos(f2) = 2cos(π(f1-f2)t)cos(π(f1+f2)t)</div>
    <div class="bullet"><div class="bullet-dot"></div>Envelope: cos(π · f_beat · t)</div>
    <div class="bullet"><div class="bullet-dot"></div>Everything follows from addition</div>
  </div>
</div>
</body>
</html>
