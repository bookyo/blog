<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Outfit', sans-serif; width: 1080px; min-height: 900px; background: #000000; margin: 0; padding: 0; }
</style>
</head>
<body class="flex items-center justify-center">
  <div class="w-[1080px] px-[80px] py-20">
    <p class="text-[20px] font-semibold text-[#00B4D8] uppercase tracking-widest">Country length</p>
    <h2 class="text-[78px] font-black text-white leading-none mt-6">15 to 31<br/>characters</h2>
    <p class="text-[24px] text-[#999999] mt-10 leading-relaxed">Norway: 15 chars. Malta: 31. The IBAN's first sanity check is the country-specific length, not the digits.</p>
    <div class="mt-12 space-y-3">
      <div class="flex justify-between border-b border-[#222] pb-3"><span class="text-[24px] text-white">Norway (NO)</span><span class="text-[24px] text-[#00B4D8] font-mono">15 chars</span></div>
      <div class="flex justify-between border-b border-[#222] pb-3"><span class="text-[24px] text-white">Belgium (BE)</span><span class="text-[24px] text-[#00B4D8] font-mono">16 chars</span></div>
      <div class="flex justify-between border-b border-[#222] pb-3"><span class="text-[24px] text-white">Germany (DE)</span><span class="text-[24px] text-[#00B4D8] font-mono">22 chars</span></div>
      <div class="flex justify-between border-b border-[#222] pb-3"><span class="text-[24px] text-white">France (FR)</span><span class="text-[24px] text-[#00B4D8] font-mono">27 chars</span></div>
      <div class="flex justify-between"><span class="text-[24px] text-white">Malta (MT)</span><span class="text-[24px] text-[#00B4D8] font-mono">31 chars</span></div>
    </div>
  </div>
</body>
</html>
